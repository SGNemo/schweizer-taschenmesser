[package]
name = "taschenmesser-local-api"
version = "0.1.0"
authors = ["SGNemo"]
description = "Loopback-only HTTP transport of the local AI import API: parsing, Host/Origin checks, token auth, limits. No Tauri, so it is unit-tested on any machine."
edition = "2021"
rust-version = "1.77"
publish = false

[lib]
name = "local_api"

[dependencies]
httparse = "1.10"
serde = { version = "1", features = ["derive"] }
sha2 = "0.10"
subtle = "2.6"
