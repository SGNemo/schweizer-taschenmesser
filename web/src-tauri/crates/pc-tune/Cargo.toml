[package]
name = "taschenmesser-pc-tune"
version = "0.1.0"
authors = ["SGNemo"]
description = "PC care for the disk module: history with undo values, a registry seam that only writes below HKCU\\Software, allow-listed Windows tools. No Tauri, so the rules are unit-tested on any machine."
edition = "2021"
rust-version = "1.77"
publish = false

[lib]
name = "pc_tune"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_System_Com",
  "Win32_System_Power",
  "Win32_System_Registry",
  "Win32_System_SystemInformation",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }
