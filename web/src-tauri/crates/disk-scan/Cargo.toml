[package]
name = "taschenmesser-disk-scan"
version = "0.1.0"
authors = ["SGNemo"]
description = "Read-only parallel directory scan, drive listing and scan-tree queries for the disk module. No Tauri, so it is unit-tested on any machine."
edition = "2021"
rust-version = "1.77"
publish = false

[lib]
name = "disk_scan"

[dependencies]
rayon = "1.10"
sha2 = "0.10"
serde = { version = "1", features = ["derive"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
# The `implement` macro of `windows` expands to paths in `windows_core`.
windows-core = "0.61"
windows = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Storage_FileSystem",
  "Win32_System_Com",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_IO",
  "Win32_System_Ioctl",
  "Win32_System_Threading",
  "Win32_UI_Shell",
] }
