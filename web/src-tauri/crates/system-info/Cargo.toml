[package]
name = "taschenmesser-system-info"
version = "0.1.0"
authors = ["SGNemo"]
description = "Read-only system facts for the system module: CPU, memory, battery, graphics adapters, local network addresses and the biggest processes. No Tauri, so it is unit-tested on any machine."
edition = "2021"
rust-version = "1.77"
publish = false

[lib]
name = "system_info"

[dependencies]
serde = { version = "1", features = ["derive"] }
sysinfo = { version = "0.38", default-features = false, features = ["system", "network", "disk"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Graphics_Dxgi",
  "Win32_Graphics_Gdi",
  "Win32_NetworkManagement_IpHelper",
  "Win32_Devices_FunctionDiscovery",
  "Win32_Media_Audio",
  "Win32_NetworkManagement_Ndis",
  "Win32_NetworkManagement_WiFi",
  "Win32_Networking_WinSock",
  "Win32_System_Com",
  "Win32_System_Com_StructuredStorage",
  "Win32_System_Power",
  "Win32_System_Registry",
  "Win32_System_SystemInformation",
  "Win32_System_Variant",
  "Win32_UI_Shell_PropertiesSystem",
] }
