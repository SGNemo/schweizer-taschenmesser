[package]
name = "taschenmesser-vault-bridge"
version = "0.1.0"
authors = ["SGNemo"]
description = "Native messaging bridge between a browser extension and the desktop vault: framing, host relay, per-user pipe server, host registration. No Tauri, so it is unit-tested on any machine."
license = "MIT"
edition = "2021"
rust-version = "1.77"
publish = false

[lib]
name = "vault_bridge"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Security_Authorization",
  "Win32_Storage_FileSystem",
  "Win32_System_IO",
  "Win32_System_Pipes",
  "Win32_System_Registry",
] }
