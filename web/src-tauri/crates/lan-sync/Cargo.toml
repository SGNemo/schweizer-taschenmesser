[package]
name = "taschenmesser-lan-sync"
version = "0.1.0"
authors = ["SGNemo"]
description = "Home-network sync hub of the desktop app. Package 1: the field store with last-write-wins, pinned by contract/*.json. No Tauri, no network, so it is unit-tested on any machine."
license = "MIT"
edition = "2021"
rust-version = "1.77"
publish = false

[lib]
name = "lan_sync"

[dependencies]
# SQLite is compiled in (like better-sqlite3 in the Node server): no system library needed.
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
getrandom = "0.3"
# Noise (package 2a). Pure Rust only: no ring resolver, no AES-GCM, no P-256, and no `std` feature
# (snow's `std` turns on `ring/std`, which would pull ring in). Exact pin: a Noise library is never floated.
snow = { version = "=0.10.0", default-features = false, features = ["use-chacha20poly1305", "use-blake2", "use-curve25519", "use-getrandom"] }
zeroize = "1"
subtle = "2"
base64 = "0.22"

# Desktop hub only (never compiled for Android/iOS, root rule): mDNS announcement of the hub.
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
mdns-sd = { version = "=0.21.7", default-features = false }
