[package]
name = "taschenmesser"
# Mirrors web/package.json (the single source of truth); `npm run version:sync` keeps it in step.
version = "0.2.0"
description = "Modular, local-first everyday app"
authors = ["SGNemo"]
edition = "2021"
rust-version = "1.77"
publish = false

[lib]
name = "taschenmesser_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
tauri = { version = "2.12", features = [] }
tauri-plugin-notification = "2.5"
tauri-plugin-http = "~2.7"
tauri-plugin-dialog = "2.8"
tauri-plugin-fs = "2.6"
tauri-plugin-clipboard-manager = "2.4"
tauri-plugin-opener = "2.6"
tauri-plugin-apk-installer = { path = "plugins/apk-installer" }
tauri-plugin-secure-store = { path = "plugins/secure-store" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# The desktop updater. Android updates through the apk-installer plugin instead.
# `minisign-verify` + `base64` re-check the signature of the portable executable before it replaces
# the running program (see src/portable.rs).
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "2.13"
minisign-verify = "0.2"
base64 = "0.22"
# Local AI import API (loopback only, off by default; src/local_api.rs).
taschenmesser-local-api = { path = "crates/local-api" }
taschenmesser-disk-scan = { path = "crates/disk-scan" }

# WebView2 runtime detection and the "runtime missing" message box (src/webview2.rs).
[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_System_Registry",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
