[package]
name = "taschenmesser"
# Mirrors web/package.json (the single source of truth); `npm run version:sync` keeps it in step.
version = "0.1.0"
description = "Modular, local-first everyday app"
authors = ["SGNemo"]
edition = "2021"
rust-version = "1.77"
publish = false

[lib]
name = "taschenmesser_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
tauri = { version = "2.12", features = [] }
tauri-plugin-notification = "2.5"
tauri-plugin-http = "~2.7"
tauri-plugin-dialog = "2.8"
tauri-plugin-fs = "2.6"
tauri-plugin-clipboard-manager = "2.4"
tauri-plugin-opener = "2.6"
tauri-plugin-apk-installer = { path = "plugins/apk-installer" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# The Windows updater. Android updates through the apk-installer plugin instead.
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "2.13"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
