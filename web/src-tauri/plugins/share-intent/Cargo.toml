[package]
name = "tauri-plugin-share-intent"
version = "0.1.0"
authors = ["SGNemo"]
description = "Android: text and links shared from other apps (ACTION_SEND). A stub elsewhere."
license = "MIT"
edition = "2021"
rust-version = "1.77"
publish = false
links = "tauri-plugin-share-intent"

[dependencies]
tauri = { version = "2.12" }
serde = { version = "1", features = ["derive"] }
thiserror = "2"

[build-dependencies]
tauri-plugin = { version = "2.7", features = ["build"] }
