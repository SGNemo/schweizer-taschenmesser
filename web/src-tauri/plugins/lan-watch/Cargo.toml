[package]
name = "tauri-plugin-lan-watch"
version = "0.1.0"
authors = ["SGNemo"]
description = "Android: Wi-Fi available/lost for home-network sync and an NsdManager search for the hub PC (Rust-only). A stub elsewhere."
license = "MIT"
edition = "2021"
rust-version = "1.77"
publish = false
links = "tauri-plugin-lan-watch"

[dependencies]
tauri = { version = "2.12" }
serde = { version = "1", features = ["derive"] }
thiserror = "2"

[build-dependencies]
tauri-plugin = { version = "2.7", features = ["build"] }
