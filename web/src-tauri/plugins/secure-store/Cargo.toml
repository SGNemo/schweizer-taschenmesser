[package]
name = "tauri-plugin-secure-store"
version = "0.1.0"
authors = ["SGNemo"]
description = "OS keystore (Windows Credential Manager / Android Keystore), biometric gate and screenshot protection."
license = "MIT"
edition = "2021"
rust-version = "1.77"
publish = false
links = "tauri-plugin-secure-store"

[dependencies]
tauri = { version = "2.12" }
serde = { version = "1", features = ["derive"] }
thiserror = "2"
base64 = "0.22"
serde_json = "1"

# Desktop keystores: Windows Credential Manager, macOS Keychain, Linux kernel keyring (no D-Bus needed).
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
keyring = { version = "3", features = ["windows-native", "apple-native", "linux-native"] }
# Wrapping of the sealed vault key under the Windows Hello signature (`src/desktop/sealed.rs`).
chacha20poly1305 = { version = "0.10", default-features = false, features = ["alloc"] }
sha2 = "0.10"
getrandom = "0.3"
zeroize = "1"

# Windows Hello key credentials (KeyCredentialManager) bind the sealed vault key.
[target.'cfg(windows)'.dependencies]
windows-future = "0.2"
windows = { version = "0.61", features = [
  "Foundation",
  "Security_Credentials",
  "Security_Cryptography",
  "Storage_Streams",
  "Win32_Foundation",
  "Win32_UI_WindowsAndMessaging",
] }

[build-dependencies]
tauri-plugin = { version = "2.7", features = ["build"] }
