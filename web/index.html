<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#fbf8f3" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0b1d2b" media="(prefers-color-scheme: dark)" />
    <meta name="description" content="Nemo – modulare, lokale Alltags-App" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>Nemo</title>
    <style>
      /* Splash: shown until React renders into #root, then replaced with it. No JS needed. */
      #splash {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        background: linear-gradient(135deg, #fbf8f3, #eef5f5);
      }
      #root:not(:empty) + #splash {
        display: none;
      }
      #splash svg {
        width: 96px;
        height: auto;
        animation: splash-in 240ms ease-out both;
      }
      @keyframes splash-in {
        from {
          opacity: 0;
          transform: translateY(6px);
        }
      }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme='light']) #splash {
          background: linear-gradient(135deg, #0b1d2b, #0f3440);
        }
      }
      :root[data-theme='dark'] #splash {
        background: linear-gradient(135deg, #0b1d2b, #0f3440);
      }
      @media (prefers-reduced-motion: reduce) {
        #splash svg {
          animation: none;
        }
      }
    </style>
    <script>
      // Apply the stored theme before first paint to avoid a flash.
      try {
        var t = localStorage.getItem('tm-theme');
        if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
        var a = localStorage.getItem('tm-accent');
        if (a === 'teal' || a === 'coral' || a === 'lagoon')
          document.documentElement.dataset.accent = a;
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <div id="splash" aria-hidden="true">
      <svg viewBox="24 96 456 304" focusable="false">
        <defs>
          <clipPath id="sp"><ellipse cx="296" cy="262" rx="172" ry="126" /></clipPath>
        </defs>
        <path d="M236 150c14-40 60-58 104-40 12 5 12 20 2 28l-24 18z" fill="#F26A1E" />
        <path
          d="M170 262C136 220 98 188 58 176c-14-4-24 8-20 22l18 64-18 64c-4 14 6 26 20 22 40-12 78-44 112-86z"
          fill="#F26A1E"
        />
        <ellipse cx="296" cy="262" rx="172" ry="126" fill="#F57A2A" />
        <g clip-path="url(#sp)" fill="#fff">
          <rect x="338" y="100" width="46" height="330" rx="23" />
          <rect x="214" y="100" width="50" height="330" rx="25" />
        </g>
        <circle cx="420" cy="238" r="18" fill="#12303A" />
      </svg>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
