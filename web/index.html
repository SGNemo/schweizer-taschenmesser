<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#fbf8f3" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0b1d2b" media="(prefers-color-scheme: dark)" />
    <meta name="description" content="Nemo – modulare, lokale Alltags-App" />
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>Nemo</title>
    <style>
      /* Splash: shown until React renders into #root, then replaced with it. No JS needed. */
      #splash {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        background: linear-gradient(135deg, #fbf8f3, #eef5f5);
      }
      #root:not(:empty) + #splash {
        display: none;
      }
      #splash svg {
        width: 120px;
        height: auto;
        animation: splash-in 240ms ease-out both;
      }
      @keyframes splash-in {
        from {
          opacity: 0;
          transform: translateY(6px);
        }
      }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme='light']) #splash {
          background: linear-gradient(135deg, #0b1d2b, #0f3440);
        }
      }
      :root[data-theme='dark'] #splash {
        background: linear-gradient(135deg, #0b1d2b, #0f3440);
      }
      @media (prefers-reduced-motion: reduce) {
        #splash svg {
          animation: none;
        }
      }
    </style>
    <script>
      // Apply the stored theme before first paint to avoid a flash.
      try {
        var t = localStorage.getItem('tm-theme');
        if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
        var a = localStorage.getItem('tm-accent');
        if (a === 'teal' || a === 'coral' || a === 'lagoon')
          document.documentElement.dataset.accent = a;
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <div id="splash" aria-hidden="true">
      <svg viewBox="60 120 410 272" focusable="false">
        <defs>
          <mask id="sp" maskUnits="userSpaceOnUse" x="0" y="0" width="512" height="512">
            <rect width="512" height="512" fill="#fff" />
            <g fill="none" stroke="#000" stroke-linecap="round">
              <path d="M262 118c-34 40-34 236 0 276" stroke-width="42" />
              <path d="M364 152c-22 30-22 178 0 208" stroke-width="34" />
            </g>
            <circle cx="420" cy="230" r="15" fill="#000" />
          </mask>
        </defs>
        <g fill="#F26A1E" mask="url(#sp)">
          <path
            d="M168 256c0-76 80-128 176-128 64 0 120 58 120 128s-56 128-120 128c-96 0-176-52-176-128z"
          />
          <path d="M184 256 100 182c-20-17-46 4-34 28l20 46-20 46c-12 24 14 45 34 28z" />
        </g>
      </svg>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
