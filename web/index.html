<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f3f4f4" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0f1316" media="(prefers-color-scheme: dark)" />
    <meta name="description" content="Nemo – modulare, lokale Alltags-App" />
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>Nemo</title>
    <style>
      /* Splash: shown until React renders into #root, then replaced with it. No JS needed. */
      #splash {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        background: linear-gradient(135deg, #f3f4f4, #e6f0f0);
      }
      #root:not(:empty) + #splash {
        display: none;
      }
      #splash svg {
        width: 120px;
        height: auto;
        animation: splash-in 240ms ease-out both;
      }
      @keyframes splash-in {
        from {
          opacity: 0;
          transform: translateY(6px);
        }
      }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme='light']) #splash {
          background: linear-gradient(135deg, #0f1316, #0f2f38);
        }
      }
      :root[data-theme='dark'] #splash {
        background: linear-gradient(135deg, #0f1316, #0f2f38);
      }
      @media (prefers-reduced-motion: reduce) {
        #splash svg {
          animation: none;
        }
      }
    </style>
    <script>
      // Apply the stored theme before first paint to avoid a flash.
      try {
        var t = localStorage.getItem('tm-theme');
        if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
        var a = localStorage.getItem('tm-accent');
        if (a === 'teal' || a === 'coral' || a === 'lagoon')
          document.documentElement.dataset.accent = a;
        if (localStorage.getItem('tm-text-size') === 'large')
          document.documentElement.dataset.textSize = 'large';
        if (localStorage.getItem('tm-density') === 'compact')
          document.documentElement.dataset.density = 'compact';
      } catch (e) {}
    </script>
  </head>
  <!-- data-nemo-ignore: the Nemo browser extension never offers or saves anything on Nemo's own pages. -->
  <body data-nemo-ignore>
    <div id="root"></div>
    <div id="splash" aria-hidden="true">
      <!-- brand:begin -->
      <svg viewBox="51 93 393 344" focusable="false">
        <defs>
          <mask id="sp" maskUnits="userSpaceOnUse" x="-512" y="-512" width="1536" height="1536">
            <rect x="-512" y="-512" width="1536" height="1536" fill="#fff" />
            <g fill="none" stroke="#000">
              <path d="M262.4 66Q323.3 208.9 436.7 315" stroke-width="40" />
              <path d="M173.3 128.4Q244.1 264.3 347.7 377.4" stroke-width="40" />
            </g>
            <circle cx="370" cy="146.1" r="23" fill="#000" />
          </mask>
        </defs>
        <g
          fill="#E0550F"
          stroke="#E0550F"
          stroke-width="10"
          stroke-linejoin="round"
          mask="url(#sp)"
        >
          <path
            d="M142.7 274.3C165.3 224.4 177.9 173.9 235.8 133.4C307.1 83.5 380.3 87 418.8 142C457.4 197 435.6 267 364.3 316.9C306.4 357.4 254.7 352 200.1 356.2Z"
          />
          <path
            d="M162.4 260.5C122.6 288.4 66.1 286.4 56.1 293.4C67.8 341.6 111.2 403.5 152.4 431.1C162.5 424 180 370.3 219.8 342.4Z"
          />
        </g>
      </svg>
      <!-- brand:end -->
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
