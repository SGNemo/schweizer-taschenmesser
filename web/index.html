<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <meta name="theme-color" content="#f3f4f4" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0f1316" media="(prefers-color-scheme: dark)" />
    <meta name="description" content="Nemo – modulare, lokale Alltags-App" />
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>Nemo</title>
    <style>
      /* Splash: shown until React renders into #root, then replaced with it. No JS needed. */
      #splash {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        background: linear-gradient(135deg, #f3f4f4, #e6f0f0);
      }
      #root:not(:empty) + #splash {
        display: none;
      }
      #splash svg {
        width: 120px;
        height: auto;
        animation: splash-in 240ms ease-out both;
      }
      @keyframes splash-in {
        from {
          opacity: 0;
          transform: translateY(6px);
        }
      }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme='light']) #splash {
          background: linear-gradient(135deg, #0f1316, #0f2f38);
        }
      }
      :root[data-theme='dark'] #splash {
        background: linear-gradient(135deg, #0f1316, #0f2f38);
      }
      @media (prefers-reduced-motion: reduce) {
        #splash svg {
          animation: none;
        }
      }
    </style>
    <script>
      // Apply the stored theme before first paint to avoid a flash.
      try {
        var t = localStorage.getItem('tm-theme');
        if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
        var a = localStorage.getItem('tm-accent');
        if (a === 'teal' || a === 'coral' || a === 'lagoon')
          document.documentElement.dataset.accent = a;
        var pal = localStorage.getItem('tm-palette');
        if (/^(korallenriff|tiefsee|sand|nordlicht|monochrom)$/.test(pal || ''))
          document.documentElement.dataset.palette = pal;
        var ts = localStorage.getItem('tm-text-size');
        if (ts === 'small' || ts === 'large' || ts === 'xlarge')
          document.documentElement.dataset.textSize = ts;
        var ld = localStorage.getItem('tm-leading');
        if (ld === 'airy' || ld === 'compact') document.documentElement.dataset.leading = ld;
        if (localStorage.getItem('tm-read-aid') === '1') {
          var rc = localStorage.getItem('tm-read-cover');
          document.documentElement.dataset.readAid =
            rc === '50' || rc === '75' || rc === '100' ? rc : '25';
        }
        var rst = localStorage.getItem('tm-read-style');
        if (rst === 'bold' || rst === 'color') document.documentElement.dataset.readStyle = rst;
        if (localStorage.getItem('tm-color') === 'calm')
          document.documentElement.dataset.color = 'calm';
        if (localStorage.getItem('tm-module-colors') === 'off')
          document.documentElement.dataset.moduleColors = 'off';
        if (localStorage.getItem('tm-motion') === 'reduce')
          document.documentElement.dataset.motion = 'reduce';
        if (localStorage.getItem('tm-density') === 'compact')
          document.documentElement.dataset.density = 'compact';
      } catch (e) {}
    </script>
  </head>
  <!-- data-nemo-ignore: the Nemo browser extension never offers or saves anything on Nemo's own pages. -->
  <body data-nemo-ignore>
    <div id="root"></div>
    <div id="splash" aria-hidden="true">
      <!-- brand:begin -->
      <svg viewBox="68 106 391 297" focusable="false">
        <defs>
          <clipPath id="sp-b">
            <path
              d="M184 222C226 184 260.2 146 315.3 146C397.3 146 452 190 452 256C452 322 397.3 366 315.3 366C260.2 366 226 328 184 290Z"
            />
          </clipPath>
          <mask id="sp" maskUnits="userSpaceOnUse" x="-512" y="-512" width="1536" height="1536">
            <rect x="-512" y="-512" width="1536" height="1536" fill="#fff" />
            <g fill="none" stroke="#000" clip-path="url(#sp-b)">
              <path d="M368.9 86Q326.9 256 368.9 426" stroke-width="24" />
              <path
                d="M262.1 86Q226.1 256 262.1 426M272.1 86Q236.1 256 272.1 426"

              />
            </g>
            <path
              d="M184 222C226 184 260.2 146 315.3 146C397.3 146 452 190 452 256C452 322 397.3 366 315.3 366C260.2 366 226 328 184 290Z"
              fill="none"
              stroke="#fff"
              stroke-width="28"
              stroke-linejoin="round"
            />
            <circle cx="408" cy="231.8" r="22" fill="#000" />
          </mask>
        </defs>
        <g
          fill="var(--accent, #b5430c)"
          stroke="var(--accent, #b5430c)"
          stroke-width="12"
          stroke-linejoin="round"
          mask="url(#sp)"
        >
          <path
            d="M184 222C226 184 260.2 146 315.3 146C397.3 146 452 190 452 256C452 322 397.3 366 315.3 366C260.2 366 226 328 184 290Z"
          />
          <path
            d="M214 222L184 222C152.2 212.6 124.6 174.2 102.4 162C81.7 155.4 69.7 169.5 76 192.1C82.1 213.7 96 236.3 96 256C96 275.7 82.1 298.3 76 319.9C69.7 342.5 81.7 356.6 102.4 350C124.6 337.8 152.2 299.4 184 290L214 290ZM245.6 195.5C252.7 112 288.3 112 309.6 112C359.3 112 387.7 154.8 387.7 195.5ZM272.4 316.5C276.5 396 296.6 396 308.6 396C336.8 396 352.8 357.2 352.8 316.5Z"
          />
        </g>
      </svg>
      <!-- brand:end -->
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
