# Nemo supporter webhook – Cloudflare Worker. Placeholders only: nothing in this file is secret.
# Secrets are set with `wrangler secret put <NAME>` (list in README.md) and never live in the repo.
name = "nemo-supporter-webhook"
main = "src/index.ts"
compatibility_date = "2026-10-01"

# Reachable at https://nemo-supporter-webhook.<your-subdomain>.workers.dev by default.
# For your own domain replace this with a route (see README → "Domain / Route").
workers_dev = true

[vars]
# Which embedded public key in the app verifies the codes this service signs (see supporter-cli).
SIGNING_KEY_ID = "1"
# Sender of the supporter mails; the domain must be verified at the mail provider.
MAIL_FROM = "Nemo <support@mail.nemo-adhd-helper.online>"
# Public address that receives donor replies (Cloudflare Email Routing forwards it to a real mailbox).
# Empty = no Reply-To header and the mail points to the donation page instead.
REPLY_TO = ""

# KV `nemo-supporter-kv`: idempotency records (hashes only), resend index, counter. The id is not a secret.
[[kv_namespaces]]
binding = "KV"
id = "5a2ce2fcb69d4c258cf20714b5497e6a"

# Mail queue with retry/backoff and a dead-letter queue as backstop (Queues work on the free plan).
[[queues.producers]]
binding = "MAIL_QUEUE"
queue = "supporter-mail"

[[queues.consumers]]
queue = "supporter-mail"
max_batch_size = 1
# Keep in step with MAX_ATTEMPTS in src/types.ts.
max_retries = 5
dead_letter_queue = "supporter-mail-dlq"

[[queues.consumers]]
queue = "supporter-mail-dlq"
max_batch_size = 1

# Rate limit per IP and route (needs wrangler >= 4.36). The service also works without it.
[[ratelimits]]
name = "RATE_LIMITER"
namespace_id = "1001"

[ratelimits.simple]
limit = 30
period = 60
