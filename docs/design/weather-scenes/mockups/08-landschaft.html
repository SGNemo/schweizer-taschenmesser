<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Wetterszene – Landschaft</title><link rel="stylesheet" href="mock.css"><script src="palette.js"></script><script src="scene.js"></script><script src="gallery.js"></script></head>
<body><h1>Landschaft: Berge oder Dorf</h1><p class="intro">Zum Vergleich: dieselben Lagen mit Bergen (Standard) und mit einem Dorf auf drei sanften Hügeln.</p>
<div id="a"></div>
<script>
var L = [['Berge', 'mountains'], ['Dorf', 'village']], W = [['Tag, klar', { phase: 'day', cond: 'clear' }], ['Nacht, klar', { phase: 'night', cond: 'clear', moon: { illum: 0.6 } }], ['Schnee', { phase: 'day', cond: 'snow', season: 'winter' }]];
var it = [];
W.forEach(function (w) { L.forEach(function (l) { it.push({ label: l[0] + ' – ' + w[0], state: Object.assign({ landscape: l[1] }, w[1]) }); }); });
Gallery.tiles('#a', it, { crops: ['wide', 'phone'], cols: 'one' });
</script></body></html>
