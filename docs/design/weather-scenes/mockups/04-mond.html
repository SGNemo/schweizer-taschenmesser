<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Wetterszene – Mond</title><link rel="stylesheet" href="mock.css"><script src="palette.js"></script><script src="scene.js"></script><script src="gallery.js"></script>
<style>.glyphs{display:grid;grid-template-columns:repeat(8,auto);gap:14px 22px;align-items:center;justify-content:start;background:var(--surface);border-radius:16px;padding:16px 20px;color:var(--text)}.glyphs .h{font-size:12px;color:var(--text-3);text-align:center}.glyphs .rl{grid-column:1/-1;font-size:13px;color:var(--text-3);margin-top:6px}.glyphs.night{background:#0b1330;color:#eceff1}.glyphs.night .h,.glyphs.night .rl{color:#aab4bb}@media(max-width:700px){.glyphs{grid-template-columns:repeat(4,auto)}}</style></head>
<body><h1>Mond</h1><p class="intro">Acht Phasen in der Szene und als kleines Zeichen (64, 28, 18 px; farbig und einfarbig für die Tageszeilen). Neigung der Sichel, Vollmond, Supermond, tiefer Mond, Tagmond, Mond hinter einer geschlossenen Wolkendecke.</p>
<p class="label">Phasen in der Szene (Nacht, klar)</p><div id="a"></div>
<p class="label">Mondzeichen</p><div id="g"></div>
<p class="label">Neigung, Größe, Lage</p><div id="b"></div>
<script>
var PH = [[0, true, 'Neumond'], [0.18, true, 'Zunehmende Sichel'], [0.5, true, 'Zunehmender Halbmond'], [0.82, true, 'Zunehmender Mond'], [1, true, 'Vollmond'], [0.82, false, 'Abnehmender Mond'], [0.5, false, 'Abnehmender Halbmond'], [0.18, false, 'Abnehmende Sichel']];
Gallery.tiles('#a', PH.map(function (p) { return { label: p[2], note: Math.round(p[0] * 100) + ' % beleuchtet', state: { phase: 'night', cond: 'clear', body: { kind: 'moon', t: 0.62 }, moon: { illum: p[0], waxing: p[1], size: p[0] === 1 ? 1.2 : 1 } } }; }));
var g = '';
[['', false], ['night', false], ['', true]].forEach(function (v) {
  g += '<div class="glyphs ' + v[0] + '">' + PH.map(function (p) { return '<div class="h">' + p[2] + '</div>'; }).join('');
  [64, 28, 18].forEach(function (px) { g += '<div class="rl">' + px + ' px' + (v[1] ? ', einfarbig (currentColor)' : ', farbig') + (v[0] ? ' auf Nachthimmel' : '') + '</div>' + PH.map(function (p) { return '<div>' + Scene.moonGlyph({ illum: p[0], waxing: p[1], size: px, mono: v[1] }) + '</div>'; }).join(''); });
  g += '</div><div style="height:12px"></div>';
});
document.getElementById('g').innerHTML = g;
var n = { phase: 'night', cond: 'clear', body: { kind: 'moon', t: 0.62 } };
function m(o, mo, b) { return Object.assign({}, n, o, { moon: Object.assign({ illum: 0.25, waxing: true }, mo), body: Object.assign({}, n.body, b) }); }
Gallery.tiles('#b', [
  { label: 'Sichel geneigt −60°', state: m({}, { tilt: -60 }) }, { label: 'Sichel geneigt −20°', state: m({}, { tilt: -20 }) },
  { label: 'Sichel geneigt +35°', state: m({}, { tilt: 35 }) }, { label: 'Vollmond (Größe 1,2)', note: 'Halo-Ring, Kanten im Mondlicht, Himmel eine Stufe heller', state: m({}, { illum: 1, size: 1.2 }) },
  { label: 'Supermond (Größe 1,35)', state: m({}, { illum: 1, size: 1.35 }) }, { label: 'Mond tief am Horizont', state: m({}, { illum: 0.9, size: 1.2 }, { t: 0.06 }) },
  { label: 'Tagmond', note: 'blasser Mond am Taghimmel', state: { phase: 'day', cond: 'mostlyClear', dayMoon: true, moon: { illum: 0.55, waxing: false }, body: { kind: 'sun', t: 0.78 } } },
  { label: 'Mond hinter geschlossener Wolkendecke (bedeckt)', state: m({ cond: 'overcast' }, { illum: 0.8 }) },
], { crops: ['wide', 'phone'], cols: 'one' });
</script></body></html>
