<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Wetterszene – Dämmerung</title><link rel="stylesheet" href="mock.css"><script src="palette.js"></script><script src="scene.js"></script><script src="gallery.js"></script></head>
<body><h1>Dämmerung, goldene Stunde, Jahreszeiten</h1><p class="intro">Morgendämmerung, goldene Stunde am Morgen (Sonne t 0,08) und am Abend (t 0,92), Abenddämmerung – je klar, leicht bewölkt und mit Regen. Darunter die vier Jahreszeiten am Tag, leicht bewölkt.</p>
<p class="label">Tageszeiten</p><div id="a"></div><p class="label">Jahreszeiten</p><div id="b"></div>
<script>
var P = [['Morgendämmerung', { phase: 'dawn' }], ['Goldene Stunde, Morgen', { phase: 'golden', body: { kind: 'sun', t: 0.08 } }],
  ['Goldene Stunde, Abend', { phase: 'golden', body: { kind: 'sun', t: 0.92 } }], ['Abenddämmerung', { phase: 'dusk' }]];
var C = [['klar', { cond: 'clear' }], ['leicht bewölkt', { cond: 'partly' }], ['Regen', { cond: 'rain', intensity: 2, season: 'autumn' }]];
var items = [];
P.forEach(function (p) { C.forEach(function (c) { items.push({ label: p[0] + ', ' + c[0], state: Object.assign({}, p[1], c[1]) }); }); });
Gallery.tiles('#a', items);
Gallery.tiles('#b', [['Frühling', 'spring'], ['Sommer', 'summer'], ['Herbst', 'autumn'], ['Winter', 'winter']].map(function (x) {
  return { label: x[0], state: { phase: 'day', cond: 'partly', season: x[1] } }; }));
</script></body></html>
