<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Fokus B2 – Zeitbalken, minimal</title><link rel="stylesheet" href="_base.css"><script>addEventListener("DOMContentLoaded",()=>{if(innerWidth<900)document.body.classList.add("phone")})</script>
<style>.focus{min-height:100vh;display:grid;place-items:center;padding:24px}.fcard{width:min(40rem,100%)}.tbar{height:10px;border-radius:5px;background:var(--surface-2);margin:18px 0 6px;overflow:hidden}.tbar i{display:block;height:100%;width:62%;background:var(--accent);border-radius:5px}</style></head><body>
<main class="focus"><div class="fcard card">
  <div class="meta">Fokus</div>
  <h1 style="font-size:32px;margin-top:6px">Formular ausfüllen</h1>
  <div class="meta" style="margin-top:6px">Nächster Schritt: <b style="color:var(--text)">Abschnitt A ausfüllen</b></div>
  <div class="tbar"><i></i></div>
  <div style="display:flex;justify-content:space-between" class="meta"><span class="num">noch 15:30</span><span>Ende 10:25</span></div>
  <div style="display:flex;gap:8px;margin-top:24px;flex-wrap:wrap"><span class="btn primary">Schritt erledigt</span><span class="btn secondary">+5 Min</span><span class="btn quiet">Beenden</span></div>
  <div class="meta" style="margin-top:16px">Ohne Timer nutzbar (Einstellung). Ring oder Balken wählbar.</div>
</div></main><div class="note">Mockup B2 · Fokusmodus</div></body></html>
