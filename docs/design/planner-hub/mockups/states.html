<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Planer-Hub – Zustände der Richtung A</title>
<style>
/* Contact sheet: the four states of the recommended direction A, each the real page at 1920 × 1080, scaled to half.
   Single images: render.mjs (a-empty, a-over, a-late, a-many; phone sheet: a-sheet). */
body{margin:0;background:#888;font:600 14px system-ui,sans-serif;color:#fff;display:grid;grid-template-columns:repeat(2,960px);gap:8px 12px;padding:12px;width:max-content}
figure{margin:0}figcaption{padding:0 0 6px}
.f{width:960px;height:540px;overflow:hidden}
iframe{width:1920px;height:1080px;border:0;transform:scale(.5);transform-origin:0 0}
</style></head>
<body>
<figure><figcaption>Leer: nichts geplant – das Feld ist die Einladung</figcaption><div class="f"><iframe src="direction-a.html?state=empty" title="Leer"></iframe></div></figure>
<figure><figcaption>Voller Tag: 40 Min mehr als planbar – neutral, mit „Rest verteilen“</figcaption><div class="f"><iframe src="direction-a.html?state=over" title="Voller Tag"></iframe></div></figure>
<figure><figcaption>Nur „Frist vorbei“: die Woche ist leer, sechs Rechnungen offen</figcaption><div class="f"><iframe src="direction-a.html?state=late" title="Nur Frist vorbei"></iframe></div></figure>
<figure><figcaption>31 Dinge an einem Tag: drei zuerst, fünf danach, der Rest gefaltet</figcaption><div class="f"><iframe src="direction-a.html?state=many" title="Viele Dinge"></iframe></div></figure>
</body></html>
