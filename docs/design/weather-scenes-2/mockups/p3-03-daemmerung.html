<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Wetter Runde 2 – Dämmerung</title><link rel="stylesheet" href="mock.css"><script src="palette.js"></script><script src="scene.js"></script><script src="events.js"></script><script src="gallery2.js"></script></head>
<body><h1>Dämmerung und tiefe Sonne</h1><p class="intro">Morgendämmerung, goldene Stunde am Morgen (tiefe Sonne, t 0,06), goldene Stunde am Abend (t 0,94), Abenddämmerung – jeweils klar, bewölkt, bedeckt, Regen 2 und Schneefall 2.</p>
<div id="a"></div>
<script>
var P = [['Morgendämmerung', { phase: 'dawn' }], ['Goldene Stunde morgens', { phase: 'golden', body: { kind: 'sun', t: 0.06 } }], ['Goldene Stunde abends', { phase: 'golden', body: { kind: 'sun', t: 0.94 } }], ['Abenddämmerung', { phase: 'dusk' }]];
var W = [['klar', { cond: 'clear' }], ['bewölkt', { cond: 'partly', cover: 3 }], ['bedeckt', { cond: 'overcast' }], ['Regen 2', { cond: 'rain', intensity: 2 }], ['Schneefall 2', { cond: 'snow', intensity: 2, snowCover: 2, season: 'winter' }]];
var items = [];
P.forEach(function (p) { W.forEach(function (w) { items.push({ label: p[0] + ' · ' + w[0], state: Object.assign({}, p[1], w[1]) }); }); });
Gallery2.tiles('#a', items, { crops: ['wide', 'phone'], cols: 'one' });
</script></body></html>
