# yaml-language-server: $schema=https://platform.claude.com/schemas/ant/beta/environment.json
# Apply: ant apply docs/meta/agents-v3/environment.yaml  (ID lands in claude-lock.json)
# limited networking: only package registries/GitHub hosts (allow_package_managers) and MCP hosts (allow_mcp_servers);
# web_search/web_fetch are disabled in every agent anyway. Environments are not versioned – note changes in README.md.
name: nemo-agents
description: Nemo agent team v3 – cloud sandbox, limited egress (package managers + GitHub MCP), Node/Rust/Playwright preinstalled.
config:
  type: cloud
  networking:
    type: limited
    allow_package_managers: true # github.com, api.github.com, registry.npmjs.org, crates.io, … (list in the environments doc)
    allow_mcp_servers: true # api.githubcopilot.com for the GitHub MCP server
