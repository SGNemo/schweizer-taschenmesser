name: Nightly

# Scheduled runs only start on the default branch (main), but the full suite has to run on develop. This
# workflow starts the complete CI (ci.yml, workflow_dispatch = full run) on develop once a night. A push to
# develop already runs everything; the nightly run catches what only shows with time (dates, caches,
# dependency drift) and re-checks a develop that has been quiet.
on:
  schedule:
    - cron: '17 1 * * *'
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  full-ci:
    name: Start the full CI on develop
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Dispatch ci.yml on develop
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run ci.yml --repo "$GITHUB_REPOSITORY" --ref develop
