name: Full CI

# Label `full-ci` on a pull request starts the complete CI once now (every package, whole E2E suite on both
# browser projects, seed project), the way a push to develop does: it dispatches ci.yml on the PR branch, and
# the checks show up on the PR's head commit. While the label stays, every new push to the PR runs the full
# set too (ci.yml reads the label). Other labels do nothing here. A dispatch (not a nested call) keeps the
# token read-only for everything that runs. See docs/HOW-TO.md -> "Which checks run when".
on:
  pull_request:
    types: [labeled]

permissions:
  actions: write
  contents: read

jobs:
  full:
    name: Start the full CI (label full-ci)
    if: ${{ github.event.label.name == 'full-ci' && github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Dispatch ci.yml on the PR branch
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ github.event.pull_request.head.ref }}
        run: gh workflow run ci.yml --repo "$GITHUB_REPOSITORY" --ref "$BRANCH"
