name: CI

on:
  push:
    branches: [develop, main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secret-scan:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      # Built from source through the Go module proxy (checksum-verified): no binary download to trust.
      # Reviewed false positives live in .gitleaksignore; new test fixtures use a `gitleaks:allow` comment.
      - name: Scan the history for secrets
        run: |
          set -euo pipefail
          go install github.com/zricethezav/gitleaks/v8@v8.21.2
          "$(go env GOPATH)/bin/gitleaks" detect --source . --redact --no-banner --verbose --exit-code 1

  web:
    name: Web (lint, types, unit, E2E)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: Version files agree (package.json, Cargo, Tauri)
        run: npm run version:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - name: E2E (app + accessibility)
        run: npm run e2e:app
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: web/playwright-report
          retention-days: 7

  server:
    name: Sync server
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test

  e2e-sync:
    name: Multi-device sync E2E
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            server/package-lock.json
      - run: npm ci
        working-directory: server
      - run: npm ci
        working-directory: web
      - run: npx playwright install --with-deps chromium
        working-directory: web
      - run: npm run e2e:sync
        working-directory: web

  rust:
    name: Native shell (fmt, clippy, tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web/src-tauri
    steps:
      - uses: actions/checkout@v4
      - name: System libraries for Tauri on Linux
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: web/src-tauri
      # tauri::generate_context! needs the frontend directory to exist; its content does not matter here.
      - name: Placeholder frontend
        run: mkdir -p ../dist && echo '<!doctype html><title>ci</title>' > ../dist/index.html
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked
