name: CI

# What runs when: docs/HOW-TO.md -> "Which checks run when" (PR / develop / nightly / release).
#  - pull request: only the packages the change touches, E2E as the smoke list (desktop), draft PRs static + unit
#  - label `full-ci` on a PR (full-ci.yml), push to main, nightly (nightly.yml), manual run: everything
#  - push to develop: everything, in two runs. This run (push) is the Dev-Preview gate with build and publish; the
#    jobs outside the gate run in a second run of this file (`part: rest`, started by develop-rest.yml), which a
#    newer push cancels. docs/howto/ci-layout.md -> "Concurrency".
run-name: ${{ inputs.part == 'rest' && format('Outside the Dev-Preview gate ({0})', github.ref_name) || '' }}
on:
  push:
    branches: [develop, main]
    # A push that only touches scribble/ (the chats' notes) starts no run at all. It cannot replace a pending
    # run of a code merge any more (a newer push replaces a pending run), and it would build nothing anyway.
    paths-ignore: ['scribble/**']
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
    inputs:
      part:
        description: 'all = every job (nightly, label full-ci, manual) | rest = only the jobs outside the Dev-Preview gate, for what changed since the last green manual run on this branch; a newer rest run cancels it'
        type: choice
        options: [all, rest]
        default: all

permissions:
  contents: read

concurrency:
  # The event is part of the group so that the nightly dispatch never cancels a push run (and vice versa).
  # A newer push to a pull request replaces its older run. Push runs for develop and main and full dispatches
  # are never cancelled: a push that lands while one is running waits its turn (GitHub keeps one pending run per
  # group, and a newer push replaces a pending run, never a running one), so every run that starts also
  # finishes, Dev-Preview build and publish included, and two publishes never overlap.
  # The one run a newer one cancels is `part: rest` (the jobs outside the Dev-Preview gate of a develop push, own
  # group): it only tests, and the run that replaces it tests everything since the last green one.
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}${{ inputs.part == 'rest' && '-rest' || '' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || inputs.part == 'rest' }}

jobs:
  # Decides what has to run. Any doubt (no diff, unreadable range, an unknown path, an error) means
  # "everything", and the jobs below also run when this job itself fails. Documentation only: nothing
  # heavy runs; the secret scan and the docs checks always run.
  #   full  = push to develop/main, manual/nightly run, or label `full-ci` on the PR: every package, the
  #           whole E2E suite (smoke + rest on both browser projects) and the seed project
  #   PR    = only the packages the change touches (below), E2E smoke list on desktop (3 shards), the seed
  #           project (`seed`) and the stimulus budget with its ratchet whenever the web app can change;
  #           a draft PR runs only the static checks and the unit tests of the web app
  #   develop = a push runs the Dev-Preview gate only (gitleaks, licences, static, unit, E2E smoke, native
  #           shell on Linux); everything else runs in the `part: rest` run of the same commit, which leaves the
  #           gate jobs out. Together they are a full run.
  changes:
    name: Which parts changed
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # A job-level block replaces the workflow-level one. `actions: read`: the rest part looks up the last green
    # manual run of this workflow (read-only).
    permissions:
      contents: read
      actions: read
    outputs:
      since: ${{ steps.diff.outputs.since }}
      stimulus: ${{ steps.diff.outputs.stimulus }}
      windows: ${{ steps.diff.outputs.windows }}
      code: ${{ steps.diff.outputs.code }}
      web: ${{ steps.diff.outputs.web }}
      e2e: ${{ steps.diff.outputs.e2e }}
      sync: ${{ steps.diff.outputs.sync }}
      server: ${{ steps.diff.outputs.server }}
      mcp: ${{ steps.diff.outputs.mcp }}
      shared: ${{ steps.diff.outputs.shared }}
      supporter: ${{ steps.diff.outputs.supporter }}
      webhook: ${{ steps.diff.outputs.webhook }}
      extension: ${{ steps.diff.outputs.extension }}
      tauri: ${{ steps.diff.outputs.tauri }}
      llm: ${{ steps.diff.outputs.llm }}
      full: ${{ steps.diff.outputs.full }}
      rest: ${{ steps.diff.outputs.rest }}
      seed: ${{ steps.diff.outputs.seed }}
      shards: ${{ steps.diff.outputs.shards }}
      e2e_profile: ${{ steps.diff.outputs.e2e_profile }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: What does the change touch?
        id: diff
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PR_DRAFT: ${{ github.event.pull_request.draft }}
          PR_LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.sha }}
          REF: ${{ github.ref }}
          REF_NAME: ${{ github.ref_name }}
          PART: ${{ inputs.part }}
          REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          code=true
          range=""
          # Which jobs of a full run belong to this run: `gate` (push to develop), `rest` (dispatch with
          # part=rest), `all` (everything else).
          part=all
          if [ "$EVENT" = "push" ] && [ "$REF" = "refs/heads/develop" ]; then part=gate; fi
          if [ "$EVENT" = "workflow_dispatch" ] && [ "$PART" = "rest" ]; then part=rest; fi
          # Push to develop: look at everything since the last *published* Dev-Preview (its release name ends in
          # +<sha7>), not only at this push. A code merge whose run was replaced by a newer push (a pending run is
          # replaced, never a running one) is then built by the next run, whatever that push contained.
          since=""
          if [ "$EVENT" = "push" ] && [ "$REF" = "refs/heads/develop" ]; then
            built="$(gh release view dev-preview --repo "$REPO" --json name -q .name 2>/dev/null | sed -n 's/.*+\([0-9a-f]\{7,40\}\)$/\1/p')"
            if [ -n "$built" ] && git cat-file -e "$built^{commit}" 2>/dev/null && git merge-base --is-ancestor "$built" "$PUSH_AFTER" 2>/dev/null; then
              since="$built"
              echo "Last published Dev-Preview was built from $built: checking $built..$PUSH_AFTER"
            fi
          fi
          # Rest part: everything since the last green manual run on this branch (a rest run or a full one). A green
          # run tested all code up to its commit or found none since the green run before it, so no commit is left
          # out, however many rest runs were cancelled in between or started by a documentation push. No such run,
          # an unknown commit or an API error: no range, so everything runs.
          if [ "$part" = "rest" ]; then
            green="$(gh api "repos/$REPO/actions/workflows/ci.yml/runs?branch=$REF_NAME&event=workflow_dispatch&status=success&per_page=1" -q '.workflow_runs[0].head_sha // ""' 2>/dev/null)"
            if [ -n "$green" ] && git cat-file -e "$green^{commit}" 2>/dev/null && git merge-base --is-ancestor "$green" "$PUSH_AFTER" 2>/dev/null; then
              since="$green"
              echo "Last green manual run tested $green: checking $green..$PUSH_AFTER"
              # The same commit was green already (a second start for one push): nothing left to test.
              if [ "$(git rev-parse "$green")" = "$(git rev-parse "$PUSH_AFTER")" ]; then code=false; fi
            fi
          fi
          if [ "$EVENT" = "pull_request" ] && [ -n "$PR_BASE" ] && [ -n "$PR_HEAD" ]; then
            range="$PR_BASE...$PR_HEAD"
          elif [ -n "$since" ]; then
            range="$since..$PUSH_AFTER"
          elif [ "$EVENT" = "push" ] && [ -n "$PUSH_BEFORE" ] && [ "${PUSH_BEFORE//0/}" != "" ]; then
            range="$PUSH_BEFORE..$PUSH_AFTER"
          fi
          # Full run: everything outside a plain pull request, or a PR labelled full-ci.
          full=true
          if [ "$EVENT" = "pull_request" ]; then
            full=false
            case ",$PR_LABELS," in *,full-ci,*) full=true ;; esac
          fi
          # Per-package flags; all true unless this is a PR whose changed files say otherwise.
          web=true; e2e=true; sync=true; server=true; mcp=true; shared=true; supporter=true
          webhook=true; extension=true; tauri=true; llm=true
          if [ -n "$range" ] && files="$(git diff --name-only "$range" 2>/dev/null)" && [ -n "$files" ]; then
            # Documentation that no test reads. README*.md, docs/AI-IMPORT*.md and docs/user/installation*.md
            # are read by unit tests (prompt and download-link checks), so they count as code.
            # site/ has its own workflow (site.yml) and never touches the app.
            ignorable='^(docs/|site/|scribble/|CLAUDE\.md$|CONTRIBUTING\.md$|SECURITY\.md$|CHANGELOG(\.de)?\.md$|LICENSE$|\.github/ISSUE_TEMPLATE/|\.github/PULL_REQUEST_TEMPLATE\.md$)'
            pinned='^docs/(AI-IMPORT(\.de)?\.md|user/installation(\.de)?\.md)$'
            relevant="$( { printf '%s\n' "$files" | grep -E "$pinned"; printf '%s\n' "$files" | grep -Ev "$ignorable"; } )"
            if [ -z "$relevant" ]; then code=false; fi
            echo "Changed files:"; printf '%s\n' "$files"
            if [ "$full" = "false" ] && [ "$code" = "true" ]; then
              has() { printf '%s\n' "$relevant" | grep -Eq "$1"; }
              # Known areas; any other path is "unknown" and turns everything on.
              known='^(web/|server/|mcp/|extension/|services/supporter-webhook/|tools/supporter-cli/|\.changes/|docs/)'
              shared=false
              if printf '%s\n' "$relevant" | grep -Evq "$known"; then shared=true; fi
              # Shared inputs of several packages (packages/, contract/, workflows, root manifests).
              if has '^(packages/|contract/|\.github/workflows/|\.github/actions/|package(-lock)?\.json$)'; then shared=true; fi
              if [ "$shared" = "true" ]; then
                echo "Shared input changed: every package runs."
              else
                web=false; e2e=false; sync=false; server=false; mcp=false; supporter=false
                webhook=false; extension=false; tauri=false; llm=false
                has '^(web/|\.changes/|docs/)' && web=true
                # Everything under web/ except the native shell can change what the browser app does.
                printf '%s\n' "$relevant" | grep -E '^web/' | grep -Evq '^web/src-tauri/' && { e2e=true; sync=true; extension=true; }
                has '^server/' && { server=true; sync=true; }
                has '^mcp/' && mcp=true
                has '^extension/' && extension=true
                has '^tools/supporter-cli/' && supporter=true
                has '^services/supporter-webhook/' && webhook=true
                has '^web/src-tauri/' && tauri=true
                has '^web/src-tauri/crates/local-llm/' && llm=true
              fi
            fi
          fi
          # Draft PR (not labelled full-ci): static checks + unit tests of the web app only.
          if [ "$EVENT" = "pull_request" ] && [ "$PR_DRAFT" = "true" ] && [ "$full" = "false" ]; then
            e2e=false; sync=false; server=false; mcp=false; supporter=false; webhook=false
            extension=false; tauri=false; llm=false; shared=false
          fi
          if [ "$code" = "false" ]; then
            web=false; e2e=false; sync=false; server=false; mcp=false; supporter=false; webhook=false
            extension=false; tauri=false; llm=false; shared=false
          fi
          # The gate E2E (smoke list, 3 shards) runs everywhere; on full runs the rest of the suite runs next to it in
          # its own jobs (they never hold up the Dev-Preview).
          shards='[1,2,3]'; profile=smoke
          rest=false
          if [ "$full" = "true" ] && [ "$e2e" = "true" ]; then rest=true; fi
          # The seed project (guards of the UI rebuild) runs whenever the app E2E runs, not only on full runs. Set
          # here, after the draft and documentation overrides above, so that those stay without it.
          seed=$e2e
          # Stimulus budget and the Windows shell have their own flags, so that the two runs of a develop push can
          # split them from the smoke E2E and the Linux shell.
          stimulus=$e2e; windows=$tauri
          # Push to develop: only the Dev-Preview gate. Rest part: everything but the gate. Applied last, so the
          # flags above mean the same in every run; the aggregate `web` reads the same flags.
          if [ "$part" = "gate" ]; then
            rest=false; seed=false; stimulus=false; windows=false; sync=false; server=false; mcp=false
            shared=false; supporter=false; webhook=false; extension=false; llm=false
          fi
          if [ "$part" = "rest" ]; then
            web=false; e2e=false; tauri=false
          fi
          {
            echo "since=$since"; echo "stimulus=$stimulus"; echo "windows=$windows"
            echo "code=$code"; echo "full=$full"; echo "rest=$rest"; echo "seed=$seed"; echo "shards=$shards"; echo "e2e_profile=$profile"
            echo "web=$web"; echo "e2e=$e2e"; echo "sync=$sync"; echo "server=$server"; echo "mcp=$mcp"
            echo "shared=$shared"; echo "supporter=$supporter"; echo "webhook=$webhook"
            echo "extension=$extension"; echo "tauri=$tauri"; echo "llm=$llm"
          } >> "$GITHUB_OUTPUT"
          echo "code=$code full=$full profile=$profile web=$web e2e=$e2e sync=$sync server=$server mcp=$mcp shared=$shared"
          echo "supporter=$supporter webhook=$webhook extension=$extension tauri=$tauri llm=$llm"
          echo "part=$part rest=$rest seed=$seed stimulus=$stimulus windows=$windows since=$since"

  # scribble/ is the chats' scratch space on develop (see scribble/README.md); the release merge removes it.
  scribble-guard:
    name: Scribble folder never reaches main
    if: github.ref == 'refs/heads/main' || github.base_ref == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: |
          if [ -e scribble ]; then
            echo "::error::scribble/ is develop-only. Remove it in the release merge (docs/howto/release-deps.md)."
            exit 1
          fi
          echo "no scribble/ on main"

  secret-scan:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
      # Built from source through the Go module proxy (checksum-verified): no binary download to trust.
      # The compiled binary is cached per version so later runs skip the build (a miss rebuilds it).
      # Reviewed false positives live in .gitleaksignore; new test fixtures use a `gitleaks:allow` comment.
      # Built fresh on every run (Go module proxy + checksum database); a cached binary could be
      # replaced from any branch that shares the cache.
      - name: Build gitleaks from source
        run: go install github.com/zricethezav/gitleaks/v8@v8.21.2
      - name: Scan the history for secrets
        run: |
          set -euo pipefail
          "$(go env GOPATH)/bin/gitleaks" detect --source . --redact --no-banner --verbose --exit-code 1

  # Docs budget check (start context, file sizes, dead links; needs only Node, no install).
  # Budget and link warnings never fail the run; an image under docs/ outside the allowed paths or over
  # 100 KB does (binaries bloat every clone). Rules: docs/meta/DOCS-GUIDE.md.
  docs-budget:
    name: Docs budget and images
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
      - run: node web/scripts/check-docs.mjs

  # Stimulus budget (focus audit, UI audit 2026-11): measures buttons, links, icons, frames, shadows, colour above
  # the fold, signature blocks and the page height per page and viewport on the seeded build and compares them,
  # strict on both sides, with web/e2e/stimulus-budget.json. Blocking: part of the aggregate check `web`.
  # The ratchet step compares merge base and head of the pull request (budget, baselines, protected guard files)
  # and is red on a hit unless the label `stimulus-raise` is on the pull request right now. It is feedback, not
  # proof: here the script comes from the pull request; the merge rule runs its `develop` version
  # (docs/howto/ci.md "Stimulus budget and ratchet").
  stimulus-budget:
    name: Stimulus budget
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.stimulus != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # A job-level block replaces the workflow-level one: `contents: read` has to be repeated.
    permissions:
      contents: read
      pull-requests: read
    env:
      PR_BASE: ${{ github.event.pull_request.base.sha }}
      PR_HEAD: ${{ github.event.pull_request.head.sha }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      GITHUB_TOKEN: ${{ github.token }}
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the ratchet needs the merge base
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - uses: ./.github/actions/playwright-chromium
      # playwright.stimulus.config.ts builds (build:e2e-seed) and serves (preview:e2e-seed) the seeded app itself
      # and uses /opt/pw-browsers/chromium only where it exists. The job summary carries the measured values.
      - run: npm run check:stimulus
      # Always the merge base, never PR_BASE itself: PR_BASE is the tip of develop when the event fired, and a
      # budget another package lowered there in the meantime would read as a raise by this pull request.
      # No pull request (push, nightly, full-ci dispatch): no label to read, the step is left out; the merge
      # rule asks for the Web check of the pull_request run. Runs also when the measurement above was red.
      - name: Ratchet (budget, baselines, protected guard files)
        if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        run: node scripts/ratchet.mjs --base "$(git merge-base "$PR_BASE" "$PR_HEAD")" --head "$PR_HEAD"

  # English docs and their German translations (README.de.md, *.de.md) must stay in step. Blocking and cheap,
  # so it also runs on doc-only changes.
  docs-pairs:
    name: Docs translations in step
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
      - run: node web/scripts/check-readme.mjs

  # The former single `web` job (about 14 min, one after the other) is split so that the pieces run side by
  # side; `web` at the bottom of this group keeps the old check name for branch protection.
  web-static:
    name: Web static (format, lint, types)
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.web != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: Version files agree (package.json, Cargo, Tauri)
        run: npm run version:check
      - name: Every module has a complete manifest and a home-screen widget
        run: npm run check:modules
      - name: Every tool has an identity, a category and keywords in all languages
        run: npm run check:tools
      - name: No two tracked paths differ only in letter case (Windows/macOS checkouts)
        run: npm run check:case
      - name: UI texts complete in every language, none hard-coded or read at import
        run: npm run check:i18n
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - name: Open legal placeholders (warning only)
        run: npm run check:legal

  # The licence check reads only the lock files, so it needs no install; it runs on every code change as it always did,
  # whatever package the change touches (the pre-check's package flags do not apply to it).
  licences:
    name: Licence list is current and every licence is allowed
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
      - run: npm run check:licenses

  # 598 files / 5421 tests: three slices by file (vitest --shard), so every test runs exactly once.
  web-unit:
    name: Web unit tests (shard ${{ matrix.shard }}/3)
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.web != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npx vitest run --shard=${{ matrix.shard }}/3

  # The Playwright suite is split into slices, each on its own runner with two workers (more workers on four
  # cores were slower per test and failed under load). Sharding is by test: every test runs exactly once.
  # This job is the smoke list (desktop-chrome, 35 spec files, 3 shards; E2E_PROFILE=smoke, list in
  # web/playwright.config.ts) and part of the Dev-Preview gate. Full runs add `web-e2e-rest` below.
  web-e2e:
    name: E2E app (smoke, shard ${{ matrix.shard }})
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.e2e != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.changes.outputs.shards || '[1,2,3]') }}
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - uses: ./.github/actions/playwright-chromium
      - name: E2E (smoke), shard ${{ matrix.shard }} of ${{ strategy.job-total }}
        run: npx playwright test --shard=${{ matrix.shard }}/${{ strategy.job-total }}
        env:
          E2E_PROFILE: smoke
          # Shard 1 also writes the build manifest for the bundle budget below (no extra build).
          VITE_BUNDLE_REPORT: ${{ matrix.shard == 1 && '1' || '' }}
      # Non-blocking bundle budget (critical path, precache) on the build the E2E step just made; the
      # numbers and how to rebaseline: docs/perf/COLD-START-2026-10.md.
      - name: Bundle budget (warning only)
        if: ${{ !cancelled() && matrix.shard == 1 }}
        continue-on-error: true
        run: node scripts/check-bundle.mjs --dir dist
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report-${{ matrix.shard }}
          path: web/playwright-report
          retention-days: 7

  # The rest of the E2E suite (everything the smoke list above does not cover: Pixel 7, accessibility, layout, the
  # other specs on desktop). Only on full runs; smoke + rest = the whole app suite, the seed project runs in its
  # own job (`e2e-seed`). Not part of the Dev-Preview gate.
  web-e2e-rest:
    name: E2E app (rest, shard ${{ matrix.shard }})
    # Runs next to the smoke E2E, not after it: measured in Nov 2026, every job of a full run started within
    # 2 s of being queued, so waiting for the smoke list only added its 4 to 12 min to the run.
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.rest != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - uses: ./.github/actions/playwright-chromium
      - name: E2E (rest), shard ${{ matrix.shard }} of ${{ strategy.job-total }}
        run: npx playwright test --shard=${{ matrix.shard }}/${{ strategy.job-total }}
        env:
          E2E_PROFILE: rest
          E2E_SEED: '0' # the seed project runs in e2e-seed
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report-rest-${{ matrix.shard }}
          path: web/playwright-report
          retention-days: 7

  # One stable check name for everything web: this is what the former single job was called.
  # A part must succeed when the pre-check asked for it and must be skipped when it did not
  # (documentation only, other packages only, draft PR without the E2E part).
  web:
    name: Web (lint, types, unit, E2E)
    needs: [changes, licences, web-static, web-unit, web-e2e, web-e2e-rest, e2e-seed, stimulus-budget]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: All requested web checks passed (and nothing else ran by accident)
        env:
          CHANGES: ${{ needs.changes.result }}
          WEB: ${{ needs.changes.outputs.web }}
          E2E: ${{ needs.changes.outputs.e2e }}
          CODE: ${{ needs.changes.outputs.code }}
          LICENCES: ${{ needs.licences.result }}
          STATIC: ${{ needs.web-static.result }}
          UNIT: ${{ needs.web-unit.result }}
          E2E_RESULT: ${{ needs.web-e2e.result }}
          REST: ${{ needs.changes.outputs.rest }}
          REST_RESULT: ${{ needs.web-e2e-rest.result }}
          SEED: ${{ needs.changes.outputs.seed }}
          SEED_RESULT: ${{ needs.e2e-seed.result }}
          STIMULUS: ${{ needs.changes.outputs.stimulus }}
          STIMULUS_RESULT: ${{ needs.stimulus-budget.result }}
        run: |
          echo "pre-check=$CHANGES web=$WEB e2e=$E2E static=$STATIC unit=$UNIT e2e-result=$E2E_RESULT"
          [ "$CHANGES" = "success" ] || echo "::notice::The pre-check did not finish; every part was asked to run."
          check() { # name result wanted
            if [ "$3" != "false" ]; then
              [ "$2" = "success" ] || { echo "::error::$1 did not succeed (result '$2'): open that job above."; exit 1; }
            else
              [ "$2" = "skipped" ] || { echo "::error::$1 should have been skipped (result '$2'); the pre-check job 'Which parts changed' said it is not needed."; exit 1; }
            fi
          }
          check "Licence list" "$LICENCES" "$CODE"
          check "Web static (format, lint, types)" "$STATIC" "$WEB"
          check "Web unit tests (shards)" "$UNIT" "$WEB"
          check "E2E app (smoke shards)" "$E2E_RESULT" "$E2E"
          check "E2E app (rest shards)" "$REST_RESULT" "$REST"
          check "E2E seed project (shards)" "$SEED_RESULT" "$SEED"
          check "Stimulus budget (budget and ratchet)" "$STIMULUS_RESULT" "$STIMULUS"

  # Server, MCP wrapper, shared vault package, supporter codes + CLI and the supporter webhook are five small
  # packages (about a minute each). They share one runner: every extra job waits for a free runner (up to
  # 14 min in the baseline), and the setup of five jobs cost more than the checks themselves. Each package
  # keeps its own steps and flag from the pre-check; a failing package does not hide the others.
  packages:
    name: Small packages (server, MCP, vault-core, supporter, webhook)
    needs: changes
    if: ${{ !cancelled() && (needs.changes.outputs.server != 'false' || needs.changes.outputs.mcp != 'false' || needs.changes.outputs.shared != 'false' || needs.changes.outputs.supporter != 'false' || needs.changes.outputs.webhook != 'false') }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: |
            server/package-lock.json
            mcp/package-lock.json
            packages/vault-core/package-lock.json
            packages/supporter-codes/package-lock.json
            tools/supporter-cli/package-lock.json
            services/supporter-webhook/package-lock.json
      - name: Install (every package that will run)
        if: ${{ !cancelled() }}
        env:
          SERVER: ${{ needs.changes.outputs.server }}
          MCP: ${{ needs.changes.outputs.mcp }}
          VAULT: ${{ needs.changes.outputs.shared }}
          SUPPORTER: ${{ needs.changes.outputs.supporter }}
          WEBHOOK: ${{ needs.changes.outputs.webhook }}
        run: |
          set -euo pipefail
          [ "$SERVER" = "false" ] || (cd server && npm ci)
          [ "$MCP" = "false" ] || (cd mcp && npm ci)
          [ "$VAULT" = "false" ] || (cd packages/vault-core && npm ci)
          if [ "$SUPPORTER" != "false" ] || [ "$WEBHOOK" != "false" ]; then (cd packages/supporter-codes && npm ci); fi
          [ "$SUPPORTER" = "false" ] || (cd tools/supporter-cli && npm ci)
          [ "$WEBHOOK" = "false" ] || (cd services/supporter-webhook && npm ci)
      - name: Sync server (format, lint, types, tests, build)
        if: ${{ !cancelled() && needs.changes.outputs.server != 'false' }}
        working-directory: server
        run: npm run format:check && npm run lint && npm run typecheck && npm test && npm run build
      - name: MCP wrapper (format, lint, types, tests, build)
        if: ${{ !cancelled() && needs.changes.outputs.mcp != 'false' }}
        working-directory: mcp
        run: npm run format:check && npm run lint && npm run typecheck && npm test && npm run build
      - name: Shared vault package (format, lint, types, tests)
        if: ${{ !cancelled() && needs.changes.outputs.shared != 'false' }}
        working-directory: packages/vault-core
        run: npm run format:check && npm run lint && npm run typecheck && npm test
      - name: Supporter codes package (format, lint, types, tests)
        if: ${{ !cancelled() && needs.changes.outputs.supporter != 'false' }}
        working-directory: packages/supporter-codes
        run: npm run format:check && npm run lint && npm run typecheck && npm test
      - name: Supporter CLI (format, lint, types, tests)
        if: ${{ !cancelled() && needs.changes.outputs.supporter != 'false' }}
        working-directory: tools/supporter-cli
        run: npm run format:check && npm run lint && npm run typecheck && npm test
      - name: Supporter webhook (format, lint, types, tests, bundle)
        if: ${{ !cancelled() && needs.changes.outputs.webhook != 'false' }}
        working-directory: services/supporter-webhook
        env:
          WRANGLER_SEND_METRICS: 'false'
        run: npm run format:check && npm run lint && npm run typecheck && npm test && npm run build

  extension:
    name: Browser extension (lint, types, tests, build, E2E)
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.extension != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            extension/package-lock.json
      # The E2E suite loads the extension into Chromium and talks to the real web app (e2e build).
      - run: npm ci
        working-directory: web
      - run: npm ci
        working-directory: extension
      - run: npm run format:check
        working-directory: extension
      - run: npm run lint
        working-directory: extension
      - run: npm run typecheck
        working-directory: extension
      - run: npm test
        working-directory: extension
      - run: npm run build
        working-directory: extension
      - run: npm run build:e2e
        working-directory: extension
      - uses: ./.github/actions/playwright-chromium
        with:
          working-directory: extension
      - name: E2E (extension in Chromium against the web app)
        run: npx playwright test
        working-directory: extension
      - name: Pack the unpacked extension
        run: npm run zip
        working-directory: extension
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nemo-extension
          path: extension/nemo-extension-*.zip
          retention-days: 14
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: extension-test-results
          path: extension/test-results
          retention-days: 7

  e2e-sync:
    name: Multi-device sync E2E
    # Next to the smoke E2E (see web-e2e-rest): on a plain PR it was the second half of an 8 min E2E wait.
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.sync != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            server/package-lock.json
      - run: npm ci
        working-directory: server
      - run: npm ci
        working-directory: web
      - uses: ./.github/actions/playwright-chromium
      - run: npm run e2e:sync
        working-directory: web

  # The Dev-Preview flavour (seed project, playwright.config.ts `seed-dev`) whenever the app E2E runs (output
  # `seed`: every pull request that can change the web app, and every full run); the app shards skip it. Part of
  # the aggregate check `web`. Its own job: it took 6.5 min behind the sync E2E in the same job.
  # Four jobs: the "every page fits the window" tests (one walk over all pages per window size and theme,
  # about a minute each; 12 in Nov 2026) and the other tests, each half in two shards. `--grep` and `--grep-invert` with the
  # same pattern split the project in two without a list to maintain: every test runs exactly once. Plain
  # shards put all walks into one job, the slowest of every web pull request (9.6 min of tests against 4.8
  # in the other shard, docs/perf/CI-2026-11.md).
  e2e-seed:
    name: E2E seed project (Dev-Preview flavour, ${{ matrix.part }}, shard ${{ matrix.shard }})
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.seed != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        part: [page walks, other]
        shard: [1, 2]
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - uses: ./.github/actions/playwright-chromium
      - name: E2E (seed project, ${{ matrix.part }}), shard ${{ matrix.shard }} of 2
        env:
          SEED_PART: ${{ matrix.part }}
          SEED_SHARD: ${{ matrix.shard }}
        run: |
          pick=--grep-invert
          if [ "$SEED_PART" = "page walks" ]; then pick=--grep; fi
          # A shard without tests exits 0: if the title of the walks is ever renamed, they all move to "other"
          # (still run once) and this part must say so instead of passing empty.
          npx playwright test --project=seed-dev "$pick" 'every page fits the window' --list | grep 'Total: [1-9]' > /dev/null \
            || { echo "::error::No test matches 'every page fits the window' ($SEED_PART): update the pattern of the e2e-seed job."; exit 1; }
          npx playwright test --project=seed-dev "$pick" 'every page fits the window' --shard="$SEED_SHARD/2"
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report-seed-${{ matrix.part == 'other' && 'other' || 'walks' }}-${{ matrix.shard }}
          path: web/playwright-report
          retention-days: 7

  rust:
    name: Native shell (fmt, clippy, tests)
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.tauri != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: web/src-tauri
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: System libraries for Tauri on Linux
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable branch, toolchain: stable
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: web/src-tauri
      # tauri::generate_context! needs the frontend directory to exist; its content does not matter here.
      - name: Placeholder frontend
        run: mkdir -p ../dist && echo '<!doctype html><title>ci</title>' > ../dist/index.html
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets --locked -p taschenmesser -p tauri-plugin-apk-installer -p tauri-plugin-secure-store -p tauri-plugin-share-intent -p tauri-plugin-lan-watch -p tauri-plugin-custom-tabs -p taschenmesser-os-association -p taschenmesser-local-api -p taschenmesser-disk-scan -p taschenmesser-system-info -p taschenmesser-browser-filter -p taschenmesser-downloader -p taschenmesser-torrent -p taschenmesser-vault-bridge -p taschenmesser-lan-sync -p taschenmesser-remote-input -- -D warnings
      - run: cargo test --locked -p taschenmesser -p tauri-plugin-apk-installer -p tauri-plugin-secure-store -p tauri-plugin-share-intent -p tauri-plugin-lan-watch -p tauri-plugin-custom-tabs -p taschenmesser-os-association -p taschenmesser-local-api -p taschenmesser-disk-scan -p taschenmesser-system-info -p taschenmesser-browser-filter -p taschenmesser-downloader -p taschenmesser-torrent -p taschenmesser-vault-bridge -p taschenmesser-lan-sync -p taschenmesser-remote-input
      # Windows-only code (named pipe, registry) of the bridge crate compiles without a Windows box.
      - run: rustup target add x86_64-pc-windows-msvc && cargo check --locked -p taschenmesser-vault-bridge --target x86_64-pc-windows-msvc

  # The Windows-only code of the shell (network identification for LAN sync, keyring, mDNS) and the crate
  # lan-sync with its bundled SQLite cannot be cross-checked from Linux: build, lint and test them natively.
  # The release build reports the exe size (placeholder frontend, no local model: a trend value, not the
  # shipped size) on full runs only (push to develop/main, nightly, label `full-ci`): it took 5.2 of the job's
  # 8.9 min on every pull request that touches Rust, for a number nobody reads there. Trade-off: clippy and
  # the tests build the debug profile, so a break that only the release profile shows (LTO, panic=abort,
  # `cfg(not(debug_assertions))`) is found by the run on develop and the release dry run, not on the pull
  # request; label `full-ci` when a pull request touches the profile or a build script. The signed release
  # build stays in release.yml.
  rust-windows:
    name: Native shell on Windows (clippy, tests, size)
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.windows != 'false' }}
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
        working-directory: web/src-tauri
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable branch, toolchain: stable
        with:
          toolchain: stable
          components: clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: web/src-tauri
          shared-key: windows-ci
      # tauri::generate_context! needs the frontend directory to exist; its content does not matter here.
      - name: Placeholder frontend
        run: mkdir -p ../dist && echo '<!doctype html><title>ci</title>' > ../dist/index.html
      - run: cargo clippy --all-targets --locked -p taschenmesser-lan-sync -p taschenmesser-remote-input -p taschenmesser-disk-scan -p taschenmesser -- -D warnings
      - run: cargo test --locked --no-fail-fast -p taschenmesser-lan-sync -p taschenmesser-remote-input -p taschenmesser-disk-scan -p taschenmesser
      # The steps below run even after a red test step, so one failure does not hide the others (the job stays red).
      - if: ${{ !cancelled() }}
        run: cargo test --locked -p taschenmesser --test commands
      - name: Release build and exe size (full runs only)
        if: ${{ !cancelled() && needs.changes.outputs.full != 'false' }}
        run: |
          cargo build --release --locked -p taschenmesser
          size=$(stat -c %s target/release/taschenmesser.exe)
          echo "### Windows exe (release, placeholder frontend, no local model)" >> "$GITHUB_STEP_SUMMARY"
          echo "taschenmesser.exe: $size bytes ($((size / 1024 / 1024)) MiB)" >> "$GITHUB_STEP_SUMMARY"
          echo "exe size: $size bytes"

  # The built-in local model: llama.cpp behind a Tauri-free crate. Compiled and tested on its own (the app
  # only pulls it in with `--features local-llm`), including a tiny random-weights model for the plumbing
  # (load, grammar, KV-cache reuse, cancel). No real model is downloaded in CI.
  local-llm:
    name: Local model runtime (fmt, clippy, tests)
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.llm != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: web/src-tauri/crates/local-llm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable branch, toolchain: stable
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: web/src-tauri/crates/local-llm
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - name: Smoke model (random weights, ~0.5 MB)
        run: |
          pip install --quiet gguf==0.19.0 numpy==2.4.6
          python3 tests/make_smoke_gguf.py "$RUNNER_TEMP/smoke.gguf"
      - run: cargo test --locked -- --test-threads=1
        env:
          NEMO_SMOKE_GGUF: ${{ runner.temp }}/smoke.gguf

  # Signed Dev-Preview (portable exe + APK) as the rolling pre-release `dev-preview`, only after a green
  # push to develop that changed more than documentation. Never on pull requests, never a stable release.
  # The build runs next to the tests (it needs nothing from them); the publish stage waits for every check
  # of this run (tests, packages, Rust, licences, docs-pairs, gitleaks) to be green, so nothing is published from a red
  # commit. The signed build artifacts of a red commit stay in the run for 3 days, but are never attached to
  # a release. See dev-preview.yml and
  # docs/howto/ci.md -> "Dev-Preview".
  dev-preview-build:
    name: Dev-Preview build
    needs: [changes]
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/develop' && needs.changes.outputs.code == 'true' }}
    # dev-preview.yml's publish job asks for contents: write; a caller must allow it even though the
    # publish job is skipped in the build stage (all other jobs there keep the workflow's read-only token).
    permissions:
      contents: write
    uses: ./.github/workflows/dev-preview.yml
    with:
      target: dev-preview
      stage: build
    secrets: inherit

  # An older run never turns the preview back: right before the publish, compare this commit with the one the
  # published preview was built from (`+<sha>` at the end of the release name). Publish when this commit is ahead
  # of it or the same (a repeated publish repairs a broken one), skip when it is behind or on another line.
  # Push runs on develop never overlap (workflow group above), so this is about a re-run of an old run. No
  # release yet or a name without a commit: publish. An API error fails the job (re-run it), it never guesses.
  # No checkout: one API call. dev-preview.yml stays untouched.
  dev-preview-fresh:
    name: Dev-Preview would not go back in time
    needs: [changes, dev-preview-build, secret-scan, licences, web-static, web-unit, web-e2e, rust]
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/develop' && needs.changes.outputs.code == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      publish: ${{ steps.order.outputs.publish }}
    steps:
      - name: Is this commit newer than the published Dev-Preview?
        id: order
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          publish=true
          if name="$(gh release view dev-preview --repo "$REPO" --json name -q .name 2>err.txt)"; then
            built="$(printf '%s\n' "$name" | sed -n 's/.*+\([0-9a-f]\{7,40\}\)$/\1/p')"
            if [ -z "$built" ]; then
              echo "Release name '$name' carries no commit: publishing."
            else
              status="$(gh api "repos/$REPO/compare/$built...$SHA" -q .status)"
              echo "Published preview: $built, this run: $SHA, this commit is '$status'."
              case "$status" in
                ahead|identical) ;;
                behind|diverged)
                  publish=false
                  echo "::warning::The published Dev-Preview ($built) is not older than this commit ($status): publish skipped."
                  echo "Dev-Preview publish skipped: the published preview \`$built\` is not older than this commit ($status)." >> "$GITHUB_STEP_SUMMARY" ;;
                *) echo "::error::Unexpected compare status '$status'."; exit 1 ;;
              esac
            fi
          elif grep -qi 'release not found' err.txt; then
            echo "No dev-preview release yet: publishing."
          else
            cat err.txt; echo "::error::Could not read the dev-preview release."; exit 1
          fi
          echo "publish=$publish" >> "$GITHUB_OUTPUT"

  # Publish gate: what can break the Dev-Preview app itself and finishes before its build does. Everything else
  # (rest of E2E, sync E2E + seed project, small packages, browser extension, local model, docs checks, CodeQL)
  # runs next to the build and after the publish: a red one turns the run red, but the preview is out already.
  # The preview is "an untested intermediate build" by its release notes; docs/HOW-TO.md "Which checks run when".
  dev-preview:
    name: Dev-Preview publish
    needs: [changes, dev-preview-build, dev-preview-fresh, secret-scan, licences, web-static, web-unit, web-e2e, rust]
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/develop' && needs.changes.outputs.code == 'true' && needs.dev-preview-fresh.outputs.publish == 'true' }}
    permissions:
      contents: write
    uses: ./.github/workflows/dev-preview.yml
    with:
      target: dev-preview
      stage: publish
      version: ${{ needs.dev-preview-build.outputs.version }}
      full: ${{ needs.dev-preview-build.outputs.full }}
      tag: ${{ needs.dev-preview-build.outputs.tag }}
      publish: ${{ needs.dev-preview-build.outputs.publish }}
    secrets: inherit

  # A red run on develop says who is next: the merges since the last green run of this part (gate: since the last
  # published Dev-Preview; rest: since the last green manual run), because a run can stand for several pushes
  # (a pending run is replaced, a rest run is cancelled by a newer one). Only starts when a job above failed.
  culprits:
    name: Red on develop – commits since the last green run
    needs: [changes, secret-scan, docs-budget, docs-pairs, stimulus-budget, licences, web-static, web-unit, web-e2e, web-e2e-rest, web, packages, extension, e2e-sync, e2e-seed, rust, rust-windows, local-llm]
    if: ${{ failure() && github.ref == 'refs/heads/develop' && github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: List the merges since the last green run
        env:
          SINCE: ${{ needs.changes.outputs.since }}
          PART: ${{ inputs.part }}
          EVENT: ${{ github.event_name }}
        run: |
          what="the last published Dev-Preview"
          if [ "$EVENT" = "workflow_dispatch" ]; then what="the last green manual run (part '${PART:-all}' or a full one)"; fi
          {
            echo "### This run is red"
            if [ -n "$SINCE" ] && git cat-file -e "$SINCE^{commit}" 2>/dev/null; then
              echo "Commits on \`develop\` since $what (\`${SINCE:0:7}\`), newest first. One of them broke it:"
              echo
              echo '```'
              git log --first-parent --oneline "$SINCE..HEAD"
              echo '```'
            else
              echo "No green run found to compare with ($what). The last 15 commits on \`develop\`:"
              echo
              echo '```'
              git log --first-parent --oneline -15
              echo '```'
            fi
            echo
            echo "Who fixes it: docs/HOW-TO.md, \"Which checks run when\"."
          } | tee -a "$GITHUB_STEP_SUMMARY"
