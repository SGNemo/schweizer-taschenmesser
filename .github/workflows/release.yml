name: Release

# Tag `vX.Y.Z` (or `vX.Y.Z-beta.N`) → signed portable Windows exe + signed Android APK + GitHub Release.
# Second way: a manual run on `main` with the input `version` (must equal web/package.json, tag must not
# exist yet) builds the same and creates the tag + release itself. Use one way per release, never both.
# Pushes to `develop` or `main` that touch the native shell (the `main` run also warms the cache that a
# manual release run on `main` can read: caches written on develop are not visible there), and manual runs WITHOUT `version`, are DRY RUNS: they
# build and upload UNSIGNED artifacts but never create a release. How to create keys/secrets and cut a release:
# see docs/howto/release-deps.md ("Release").
#
# Signing keys live in the GitHub Environment `release-signing` (tags v*.*.* and main only) and are touched by
# exactly one job, `sign`: build (no keys, caches only for dry runs) -> sign (inline shell, no checkout, no repo
# scripts, no caches) -> verify (no keys, repo scripts) -> release (contents: write, no keys) -> website
# (environment `site-hook`). A run that does not publish never requests an environment. docs/howto/ci.md.

on:
  push:
    tags: ['v*.*.*']
    branches: [develop, main]
    paths:
      - 'web/src-tauri/**'
      - 'web/scripts/**'
      - '.github/workflows/release.yml'
  workflow_dispatch:
    inputs:
      version:
        description: 'Publish this version from main (must equal web/package.json; creates tag vX.Y.Z). Empty = dry run.'
        required: false
        default: ''
        type: string
      sign_only:
        description: 'Rehearsal on main: run sign (not verify) with the real environment, publish nothing, upload nothing.'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  # One group per ref: a release started right after a push to main waits for that push's dry run, which
  # leaves the Windows cache warm. (GitHub keeps one pending run per group; a newer push replaces a pending one.)
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  NODE_VERSION: 26
  NDK_VERSION: '27.2.12479018'
  # The signer is installed in the sign job from the npm registry without install scripts; both packages are
  # pinned by integrity (same values as web/package-lock.json). Bump together with @tauri-apps/cli.
  TAURI_CLI_VERSION: '2.12.4'
  TAURI_CLI_INTEGRITY: 'sha512-JI9bHfudSRJikGOrjbXEm6RjzzvmKuLc+JixB1NE8hNzQkNlCCIC3pTES3uypkR9lxHrsbxzcnSwhI2IxBQphw=='
  TAURI_CLI_LINUX_INTEGRITY: 'sha512-tNzZSa79Z1nRpHxEpQ38lsAFpKlFlYvoXzjTV+lRRn/zSf3wrdUC3wnLcq2XEadchPu4ttK0zivhYzr+XGD19Q=='

jobs:
  secret-scan:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the whole history is scanned, not just the last commit
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
      # Built from source through the Go module proxy (checksum-verified by go.sum / sumdb): no binary download to trust.
      # The compiled binary is cached per version so later runs skip the build (a miss rebuilds it).
      # Built fresh on every run (Go module proxy + checksum database); a cached binary could be
      # replaced from any branch that shares the cache.
      - name: Build gitleaks from source
        run: go install github.com/zricethezav/gitleaks/v8@v8.21.2
      - name: Scan the history for secrets
        run: |
          set -euo pipefail
          "$(go env GOPATH)/bin/gitleaks" detect --source . --redact --no-banner --verbose --exit-code 1

  prepare:
    needs: secret-scan
    name: Version, changelog, publish check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      version: ${{ steps.meta.outputs.version }}
      tag: ${{ steps.meta.outputs.tag }}
      prerelease: ${{ steps.meta.outputs.prerelease }}
      publish: ${{ steps.meta.outputs.publish }}
      sign: ${{ steps.meta.outputs.sign }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # tags and history for the changelog
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Version
        id: meta
        working-directory: web
        env:
          INPUT_VERSION: ${{ inputs.version }}
          SIGN_ONLY: ${{ inputs.sign_only }}
        run: |
          set -euo pipefail
          VERSION="$(node scripts/version.mjs print)"
          node scripts/version.mjs check
          PUBLISH=false
          SIGN=false
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            PUBLISH=true
            if [[ "$GITHUB_REF_NAME" != "v$VERSION" ]]; then
              echo "::error::Tag $GITHUB_REF_NAME does not match the version in web/package.json ($VERSION). Run 'npm run version:set -- <version>' and commit before tagging."
              exit 1
            fi
          elif [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" && -n "$INPUT_VERSION" ]]; then
            if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
              echo "::error::Publishing by manual run is only allowed on main (this run: $GITHUB_REF)."
              exit 1
            fi
            if [[ "$INPUT_VERSION" != "$VERSION" ]]; then
              echo "::error::Input version '$INPUT_VERSION' does not match the version in web/package.json ($VERSION)."
              exit 1
            fi
            if git rev-parse -q --verify "refs/tags/v$VERSION" >/dev/null; then
              echo "::error::Tag v$VERSION already exists. Existing releases are never overwritten."
              exit 1
            fi
            PUBLISH=true
          fi
          if [[ "$SIGN_ONLY" == "true" ]]; then
            if [[ "$PUBLISH" == "true" || "$GITHUB_REF" != "refs/heads/main" ]]; then
              echo "::error::sign_only is a rehearsal on main without a version (this run: $GITHUB_REF, publish=$PUBLISH)."
              exit 1
            fi
            SIGN=true
          fi
          if [[ "$PUBLISH" == "true" ]]; then SIGN=true; fi
          # Only commits that are already on main are ever signed: a tag (or a manual run) on a commit that
          # never went through main does not get the keys, whoever created it.
          if [[ "$SIGN" == "true" ]] && ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$GITHUB_SHA is not on main. Signing keys are only used for commits that are on main."
            exit 1
          fi
          {
            echo "version=$VERSION"
            echo "tag=v$VERSION"
            echo "prerelease=$([[ "$VERSION" == *-* ]] && echo true || echo false)"
            echo "publish=$PUBLISH"
            echo "sign=$SIGN"
          } >> "$GITHUB_OUTPUT"
          echo "Version $VERSION, versionCode $(node scripts/version.mjs code), publish=$PUBLISH, sign=$SIGN"

      - name: Legal placeholders are filled (blocks publishing only)
        working-directory: web
        env:
          PUBLISH: ${{ steps.meta.outputs.publish }}
        run: |
          set -euo pipefail
          if [[ "$PUBLISH" == "true" ]]; then
            node scripts/check-legal.mjs --strict
          else
            node scripts/check-legal.mjs
          fi

      - name: Updater public key must not be the development placeholder
        if: steps.meta.outputs.sign == 'true'
        working-directory: web
        run: |
          KEY_ID="$(node -e "const c=require('./src-tauri/tauri.conf.json');console.log(Buffer.from(c.plugins.updater.pubkey,'base64').toString().split('\n')[0])")"
          echo "$KEY_ID"
          if [[ "$KEY_ID" == *76760D11981F2BAC* ]]; then
            echo "::error::plugins.updater.pubkey in web/src-tauri/tauri.conf.json is still the development placeholder. Put the public key from 'node scripts/keys.mjs updater' there (docs/howto/release-deps.md → Release) - otherwise installed apps could never verify an update."
            exit 1
          fi

      # The sections were written into CHANGELOG.md / CHANGELOG.de.md by `npm run changelog:release` in the
      # release commit (docs/howto/changelog.md); the notes are the same text, German above, English below.
      - name: Release notes from the changelog section
        working-directory: web
        run: node scripts/changelog-notes.mjs "${{ steps.meta.outputs.version }}" --out "$RUNNER_TEMP/RELEASE_NOTES.md"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-notes
          path: ${{ runner.temp }}/RELEASE_NOTES.md

  windows:
    name: Windows (portable, unsigned)
    needs: prepare
    runs-on: windows-latest
    timeout-minutes: 45
    outputs:
      sha: ${{ steps.collect.outputs.sha }}
    env:
      CARGO_TARGET_DIR: C:/t
    defaults:
      run:
        working-directory: web
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # A build that goes to the sign job (publish) restores no cache at all: a cache entry written by any
      # earlier run could otherwise end up inside a signed binary. Dry runs keep the caches.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: ${{ needs.prepare.outputs.sign != 'true' && 'npm' || '' }}
          cache-dependency-path: web/package-lock.json
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable branch, toolchain: stable
        with:
          toolchain: stable
      # The build below writes into C:/t (CARGO_TARGET_DIR, short path for llama.cpp). rust-cache does not
      # derive its target directory from that variable (it kept saving the empty src-tauri/target: 476 of
      # 476 crates were rebuilt on every run, 19 min), so C:/t is cached as an extra directory and the
      # unused default target is skipped. The registry and cargo bin are still cached as before.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        if: ${{ needs.prepare.outputs.sign != 'true' }}
        with:
          workspaces: web/src-tauri
          shared-key: windows-release
          cache-targets: false
          cache-directories: C:/t
      - run: npm ci
      # Built-in local model (llama.cpp, Vulkan + CPU in one exe). cmake and LLVM (bindgen) are on the
      # runner image; the Vulkan SDK (headers, loader import library, glslc) comes from Chocolatey, whose
      # package checks the installer's checksum. The weights are never part of the build (downloaded by
      # the user after consent, checksum-verified). See docs/decisions/local-model.md.
      - name: Vulkan SDK (for the local model's GPU backend)
        shell: pwsh
        run: |
          choco install vulkan-sdk -y --no-progress
          $sdk = (Get-ChildItem 'C:\VulkanSDK' -Directory | Sort-Object Name -Descending | Select-Object -First 1).FullName
          if (-not $sdk) { throw 'Vulkan SDK not found after install' }
          "VULKAN_SDK=$sdk" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "$sdk\Bin" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8

      # One self-contained executable with the frontend embedded – no NSIS/MSI installer.
      # llama.cpp builds its Vulkan shader generator (`vulkan-shaders-gen`) as a nested CMake project, and
      # two things break it on Windows: (1) the Visual Studio generator runs its ExternalProject steps out
      # of order in a parallel build ("Not a file ... cmake_install.cmake", "cannot find the batch label
      # specified - VCEnd"), so CMake builds with Ninja; (2) under the default target directory the nested
      # paths pass the Windows limit ("object file directory has 277 characters", "Cannot open source
      # file"), so Cargo builds into a short directory and the executable is put back where the following
      # steps expect it.
      - name: Build
        env:
          CMAKE_GENERATOR: Ninja
        run: npx tauri build --no-bundle -- --features local-llm-vulkan --locked

      - name: Put the executable where the next steps expect it
        run: |
          set -euo pipefail
          mkdir -p src-tauri/target/release
          cp C:/t/release/taschenmesser.exe src-tauri/target/release/taschenmesser.exe

      # Nothing is signed here: this job holds no key. Dry runs end with this unsigned file; a publishing run
      # hands it to the `sign` job together with its SHA-256.
      - name: Collect the unsigned executable
        id: collect
        run: |
          set -euo pipefail
          mkdir -p ../assets
          cp src-tauri/target/release/taschenmesser.exe ../assets/Nemo-Portable-UNSIGNED.exe
          echo "sha=$(sha256sum ../assets/Nemo-Portable-UNSIGNED.exe | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          ls -l ../assets

      # The program has to stay alive for a while (window created, WebView2 found). Informational only:
      # a hosted runner is not a real desktop.
      - name: Smoke test – the executable starts
        continue-on-error: true
        run: |
          set +e
          ../assets/Nemo-Portable-UNSIGNED.exe &
          PID=$!
          sleep 20
          if kill -0 "$PID" 2>/dev/null; then
            echo "The portable executable is still running after 20 s."
            kill "$PID"
          else
            echo "::warning::The portable executable exited within 20 s."
            exit 1
          fi

      # This job holds no secret, so there is no secret value to look for; the pattern checks still run. The full
      # audit (with the key pair and the signed files) runs in `verify`.
      - name: Audit – patterns in the executable or what goes into it
        run: |
          set -euo pipefail
          node scripts/audit-release.mjs --path dist --path ../assets --path src-tauri/target/release/taschenmesser.exe

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-unsigned
          path: assets/*
          if-no-files-found: error

  android:
    name: Android APK (unsigned)
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 40
    outputs:
      sha: ${{ steps.collect.outputs.sha }}
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 17
          cache: ${{ needs.prepare.outputs.sign != 'true' && 'gradle' || '' }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: ${{ needs.prepare.outputs.sign != 'true' && 'npm' || '' }}
          cache-dependency-path: web/package-lock.json
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable branch, toolchain: stable
        with:
          toolchain: stable
          targets: aarch64-linux-android,armv7-linux-androideabi
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        if: ${{ needs.prepare.outputs.sign != 'true' }}
        with:
          workspaces: web/src-tauri
      - run: npm ci

      - name: Android SDK and NDK
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platforms;android-34" "platforms;android-35" "platforms;android-36" "build-tools;35.0.0" "ndk;$NDK_VERSION"
          echo "NDK_HOME=$ANDROID_HOME/ndk/$NDK_VERSION" >> "$GITHUB_ENV"

      # The Gradle project is generated, not committed (src-tauri/gen is git-ignored).
      - run: npx tauri android init --ci
      # The template leaves `android:allowBackup` unset (= true: the app data would go to Google backup).
      - name: Android manifest hardening (allowBackup off)
        run: node scripts/android-manifest.mjs
      # Launcher shortcuts (share-intent plugin, res/xml/shortcuts.xml) name their target app
      # literally: resource XML knows no ${applicationId}. Point them at this build's id.
      - name: Application id into the launcher shortcuts
        run: node scripts/android-shortcuts.mjs src-tauri/tauri.conf.json
      # `tauri android init` writes the CLI's template icons; the project's launcher layers
      # (adaptive foreground/monochrome, notification icon, rendered by gen-icons) live in git.
      - name: Project icons into the generated Android project
        run: cp -r src-tauri/icons/android/. src-tauri/gen/android/app/src/main/res/

      - name: Build the (unsigned) universal APK
        run: npx tauri android build --apk --target aarch64 armv7 --config "$(node scripts/version.mjs android-config)"

      - name: Locate the APK
        id: apk
        run: |
          set -euo pipefail
          APK="$(find src-tauri/gen/android/app/build/outputs/apk -name '*.apk' | head -n1)"
          test -n "$APK"
          echo "path=$APK" >> "$GITHUB_OUTPUT"
          ls -l "$APK"

      # Nothing is signed here: this job holds no key and no keystore.
      - name: Collect the unsigned APK
        id: collect
        run: |
          set -euo pipefail
          mkdir -p ../assets
          cp "${{ steps.apk.outputs.path }}" ../assets/Nemo-UNSIGNED.apk
          echo "sha=$(sha256sum ../assets/Nemo-UNSIGNED.apk | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          ls -l ../assets

      # No secret in this job, so no secret value to look for; the full audit runs in `verify`.
      - name: Audit – patterns in the APK or what goes into it
        run: |
          set -euo pipefail
          node scripts/audit-release.mjs --path dist --path ../assets

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-unsigned
          path: assets/*
          if-no-files-found: error

  # The only job that sees the signing keys. Everything in it is written here, in this file: no checkout, no
  # repository script, no `npm ci` of the app, no cache, no third-party action, nothing written to GITHUB_ENV or
  # GITHUB_PATH. Environment `release-signing` allows only tags v*.*.* and main (GitHub enforces that, a branch
  # cannot change it). It signs only when publishing (or for the `sign_only` rehearsal on main).
  sign:
    name: Sign (release keys)
    needs: [prepare, windows, android]
    if: needs.prepare.outputs.sign == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: release-signing
    permissions:
      contents: read
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: windows-unsigned
          path: in
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: android-unsigned
          path: in

      # What is signed is exactly what the build jobs produced (the hashes come from their job outputs).
      - name: The unsigned files are the ones the build jobs produced
        env:
          WIN_SHA: ${{ needs.windows.outputs.sha }}
          ANDROID_SHA: ${{ needs.android.outputs.sha }}
        run: |
          set -euo pipefail
          cd in
          echo "$WIN_SHA  Nemo-Portable-UNSIGNED.exe" | sha256sum -c -
          echo "$ANDROID_SHA  Nemo-UNSIGNED.apk" | sha256sum -c -

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: All six signing secrets must be present
        env:
          TAURI_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          ANDROID_KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KS_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_ALIAS_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          missing=()
          [ -n "$TAURI_KEY" ] || missing+=(TAURI_SIGNING_PRIVATE_KEY)
          [ -n "$TAURI_KEY_PASSWORD" ] || missing+=(TAURI_SIGNING_PRIVATE_KEY_PASSWORD)
          [ -n "$ANDROID_KS" ] || missing+=(ANDROID_KEYSTORE_BASE64)
          [ -n "$ANDROID_KS_PASSWORD" ] || missing+=(ANDROID_KEYSTORE_PASSWORD)
          [ -n "$ANDROID_ALIAS" ] || missing+=(ANDROID_KEY_ALIAS)
          [ -n "$ANDROID_ALIAS_PASSWORD" ] || missing+=(ANDROID_KEY_PASSWORD)
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::error::Missing secrets in the release-signing environment: ${missing[*]}. Nothing was signed or published – see docs/howto/release-deps.md → Release."
            exit 1
          fi

      # The Tauri CLI is installed without install scripts; both packages must match the pinned integrity.
      - name: Install the signer
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/signer"
          cd "$RUNNER_TEMP/signer"
          npm init -y > /dev/null
          npm install --ignore-scripts --no-audit --no-fund "@tauri-apps/cli@$TAURI_CLI_VERSION"
          node -e '
          const lock = JSON.parse(require("node:fs").readFileSync("package-lock.json", "utf8")).packages;
          const want = {
            "node_modules/@tauri-apps/cli": process.env.TAURI_CLI_INTEGRITY,
            "node_modules/@tauri-apps/cli-linux-x64-gnu": process.env.TAURI_CLI_LINUX_INTEGRITY,
          };
          const unknown = Object.keys(lock).filter((k) => k && !k.startsWith("node_modules/@tauri-apps/cli"));
          if (unknown.length) throw new Error("unexpected packages: " + unknown.join(", "));
          for (const [k, v] of Object.entries(want)) {
            if (lock[k]?.integrity !== v) throw new Error("integrity mismatch for " + k);
          }
          console.log("signer packages match the pinned integrity");
          '
          "$RUNNER_TEMP/signer/node_modules/.bin/tauri" --version

      - name: Sign the portable executable with the updater key
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          mkdir -p out
          cp in/Nemo-Portable-UNSIGNED.exe out/Nemo-Portable.exe
          "$RUNNER_TEMP/signer/node_modules/.bin/tauri" signer sign out/Nemo-Portable.exe
          test -s out/Nemo-Portable.exe.sig

      - name: Android build-tools
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "build-tools;35.0.0"

      - name: Sign the APK
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          APK_KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          APK_KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          BT="$ANDROID_HOME/build-tools/35.0.0"
          KEYSTORE="$RUNNER_TEMP/release.jks"
          # The keystore file exists only while signing – removed on success AND on failure.
          trap 'rm -f "$KEYSTORE"' EXIT
          umask 077
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$KEYSTORE"
          mkdir -p out
          # -p: page-align stored .so files (16 KB page devices), 4-byte alignment; passwords by environment only.
          "$BT/zipalign" -p -f 4 in/Nemo-UNSIGNED.apk "$RUNNER_TEMP/aligned.apk"
          "$BT/apksigner" sign --ks "$KEYSTORE" --ks-key-alias "$KEY_ALIAS" \
            --ks-pass env:APK_KS_PASS --key-pass env:APK_KEY_PASS \
            --out out/Nemo.apk "$RUNNER_TEMP/aligned.apk"
          "$BT/apksigner" verify --verbose --print-certs out/Nemo.apk
          "$BT/zipalign" -c -p 4 out/Nemo.apk
          (cd out && sha256sum Nemo.apk > Nemo.apk.sha256 && cat Nemo.apk.sha256)

      - name: Make sure no keystore file is left on the runner
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"

      # The audit's secret-value check, done here because this is the only job that has the values (the build
      # jobs have none, `verify` has none). Plain Node built-ins, values only from this step's environment, only
      # the NAME of a secret is ever printed. Looks into the raw files and into zip/APK entries (3 levels).
      - name: Audit – no secret value in what was signed
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const zlib = require('node:zlib');
          const MIN = 12;
          const names = [
            'TAURI_SIGNING_PRIVATE_KEY',
            'TAURI_SIGNING_PRIVATE_KEY_PASSWORD',
            'ANDROID_KEYSTORE_BASE64',
            'ANDROID_KEYSTORE_PASSWORD',
            'ANDROID_KEY_PASSWORD',
          ];
          function needles(value) {
            const list = [Buffer.from(value, 'utf8')];
            const compact = value.replace(/\s+/g, '');
            if (/^[A-Za-z0-9+/=]{16,}$/.test(compact)) {
              const decoded = Buffer.from(compact, 'base64');
              if (decoded.length >= MIN) list.push(decoded);
            }
            for (const line of value.split(/\r?\n/)) {
              if (line.trim().length >= MIN) list.push(Buffer.from(line.trim(), 'utf8'));
            }
            return list;
          }
          function zipEntries(buf) {
            const out = [];
            const eocd = buf.lastIndexOf(Buffer.from([0x50, 0x4b, 0x05, 0x06]));
            if (eocd < 0) return out;
            const count = buf.readUInt16LE(eocd + 10);
            let p = buf.readUInt32LE(eocd + 16);
            for (let i = 0; i < count && buf.readUInt32LE(p) === 0x02014b50; i++) {
              const method = buf.readUInt16LE(p + 10);
              const size = buf.readUInt32LE(p + 20);
              const nameLen = buf.readUInt16LE(p + 28);
              const extraLen = buf.readUInt16LE(p + 30);
              const commentLen = buf.readUInt16LE(p + 32);
              const local = buf.readUInt32LE(p + 42);
              const start = local + 30 + buf.readUInt16LE(local + 26) + buf.readUInt16LE(local + 28);
              const raw = buf.subarray(start, start + size);
              try {
                const data = method === 0 ? raw : method === 8 ? zlib.inflateRawSync(raw) : Buffer.alloc(0);
                out.push(data);
              } catch {
                /* an entry that cannot be inflated holds no readable secret */
              }
              p += 46 + nameLen + extraLen + commentLen;
            }
            return out;
          }
          function expand(data, depth = 0) {
            const list = [data];
            if (depth < 3 && data.length > 22 && data.readUInt32LE(0) === 0x04034b50) {
              for (const e of zipEntries(data)) list.push(...expand(e, depth + 1));
            }
            return list;
          }
          // Same rule as web/scripts/lib/audit.ts: a value shorter than MIN is not searched (it would match
          // anything). A secret that is missing altogether stops the run; a short one is named in a warning.
          const searchable = [];
          for (const name of names) {
            const value = (process.env[name] ?? '').trim();
            if (value.length === 0) {
              console.error(`::error::${name} is empty.`);
              process.exit(1);
            }
            if (value.length < MIN) {
              console.log(`::warning::${name} is shorter than ${MIN} characters and is not searched for.`);
              continue;
            }
            searchable.push({ name, needles: needles(value) });
          }
          let bad = 0;
          for (const file of fs.readdirSync('out')) {
            for (const data of expand(fs.readFileSync(path.join('out', file)))) {
              for (const s of searchable) {
                if (s.needles.some((n) => data.includes(n))) {
                  console.error(`::error::The value of ${s.name} appears in out/${file}.`);
                  bad++;
                }
              }
            }
          }
          if (bad > 0) process.exit(1);
          console.log(`No secret value found in ${fs.readdirSync('out').length} signed file(s).`);
          NODE

      # Rehearsal (sign_only): proves environment, secrets and signer; nothing is uploaded.
      - name: Rehearsal summary
        if: needs.prepare.outputs.publish != 'true'
        run: |
          {
            echo "## Signing rehearsal – nothing was uploaded or published"
            echo
            echo '```'
            (cd out && sha256sum Nemo-Portable.exe Nemo-Portable.exe.sig Nemo.apk)
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: needs.prepare.outputs.publish == 'true'
        with:
          name: signed
          path: out/*
          if-no-files-found: error

  # No keys here. Repository scripts check what the sign job produced before anything is published.
  verify:
    name: Verify the signed files
    needs: [prepare, sign]
    if: needs.prepare.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: signed
          path: dl
      - name: Executable signature matches the updater public key
        working-directory: web
        run: node scripts/verify-sig.mjs ../dl/Nemo-Portable.exe --pubkey-from src-tauri/tauri.conf.json
      - name: APK signature and package id
        run: |
          set -euo pipefail
          BT="$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -n1)"
          "${BT}apksigner" verify --print-certs dl/Nemo.apk | grep -E "Verifies|SHA-256 digest" | sed 's/^/  /'
          "${BT}aapt2" dump badging dl/Nemo.apk | grep -E "^package: name='io.github.sgnemo.taschenmesser' "
          (cd dl && sha256sum -c Nemo.apk.sha256)
      - name: Audit – patterns and signatures in what is about to be published
        run: node web/scripts/audit-release.mjs --path dl --pubkey-from web/src-tauri/tauri.conf.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: verified
          path: dl/*
          if-no-files-found: error

  release:
    name: GitHub Release
    needs: [prepare, verify]
    if: needs.prepare.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: verified
          path: dl
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-notes
          path: dl

      - name: Updater manifest (latest.json)
        run: |
          node web/scripts/latest-json.mjs --dir dl \
            --version "${{ needs.prepare.outputs.version }}" \
            --tag "${{ needs.prepare.outputs.tag }}" \
            --repo "$GITHUB_REPOSITORY" \
            --notes dl/RELEASE_NOTES.md --out dl/latest.json
          cat dl/latest.json
          node web/scripts/audit-release.mjs --path dl/latest.json

      # The checksum must match its file and latest.json must point at the Nemo executable.
      - name: Verify checksum and manifest
        run: |
          set -euo pipefail
          cd dl
          sha256sum -c Nemo.apk.sha256
          grep -q '/Nemo-Portable.exe"' latest.json

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # The list of assets lives in web/scripts/lib/releaseAssets.ts (also used by the link check).
          mapfile -t NAMES < <(node web/scripts/release-assets.mjs)
          FILES=()
          for f in "${NAMES[@]}"; do
            [ -f "dl/$f" ] && FILES+=("dl/$f")
          done
          if [ "${#FILES[@]}" -ne "${#NAMES[@]}" ]; then
            echo "::error::A release needs all ${#NAMES[@]} assets, found ${#FILES[@]}: ${FILES[*]}"
            exit 1
          fi
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            TAG_ARGS=(--verify-tag)
          else
            TAG_ARGS=(--target "$GITHUB_SHA") # manual run on main: gh creates the tag on exactly this commit
          fi
          ARGS=("${TAG_ARGS[@]}" --title "Nemo ${{ needs.prepare.outputs.version }}" --notes-file dl/RELEASE_NOTES.md)
          if [ "${{ needs.prepare.outputs.prerelease }}" = "true" ]; then ARGS+=(--prerelease); fi
          gh release create "${{ needs.prepare.outputs.tag }}" "${ARGS[@]}" "${FILES[@]}"

      # The README badges and the in-app updater rely on these URLs.
      - name: Check the download links of the published release
        run: |
          STABLE=""
          if [ "${{ needs.prepare.outputs.prerelease }}" != "true" ]; then STABLE="--stable"; fi
          node web/scripts/check-links.mjs --repo "$GITHUB_REPOSITORY" --tag "${{ needs.prepare.outputs.tag }}" $STABLE

  # Deploy hook of the Cloudflare Pages site (shows version, size and checksums of the latest release). Own
  # environment so that it needs no second approval and `release` holds no environment secret. No-op while the
  # secret is empty (site/README.md, step 6).
  website:
    name: Rebuild the website
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: site-hook
    permissions: {}
    steps:
      - name: Call the deploy hook
        env:
          CF_PAGES_DEPLOY_HOOK: ${{ secrets.CF_PAGES_DEPLOY_HOOK }}
        # The check lives in the script: a step's own `env` is not visible to its `if:`.
        run: |
          if [ -z "$CF_PAGES_DEPLOY_HOOK" ]; then echo "No deploy hook configured, skipping."; exit 0; fi
          curl -fsS -X POST "$CF_PAGES_DEPLOY_HOOK" > /dev/null

  summary:
    name: Dry-run summary
    needs: [prepare, windows, android]
    if: always() && needs.prepare.outputs.publish != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dl
          merge-multiple: true
      - name: List what was built
        run: |
          {
            echo "## Dry run – nothing was published"
            echo
            echo "Version \`${{ needs.prepare.outputs.version }}\`. The files are UNSIGNED: no signing key is used by a run that does not publish."
            echo
            echo '```'
            ls -l dl
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
