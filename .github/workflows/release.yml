name: Release

# Tag `vX.Y.Z` (or `vX.Y.Z-beta.N`) → signed portable Windows exe + signed Android APK + GitHub Release.
# Second way: a manual run on `main` with the input `version` (must equal web/package.json, tag must not
# exist yet) builds the same and creates the tag + release itself. Use one way per release, never both.
# Pushes to `develop` that touch the native shell, and manual runs WITHOUT `version`, are DRY RUNS: they
# build and upload artifacts but never create a release. How to create keys/secrets and cut a release:
# see docs/howto/release-deps.md ("Release").

on:
  push:
    tags: ['v*.*.*']
    branches: [develop]
    paths:
      - 'web/src-tauri/**'
      - 'web/scripts/**'
      - '.github/workflows/release.yml'
  workflow_dispatch:
    inputs:
      version:
        description: 'Publish this version from main (must equal web/package.json; creates tag vX.Y.Z). Empty = dry run.'
        required: false
        default: ''
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  NODE_VERSION: 26
  NDK_VERSION: '27.2.12479018'

jobs:
  secret-scan:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0 # the whole history is scanned, not just the last commit
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
      # Built from source through the Go module proxy (checksum-verified by go.sum / sumdb): no binary download to trust.
      # The compiled binary is cached per version so later runs skip the build (a miss rebuilds it).
      # Built fresh on every run (Go module proxy + checksum database); a cached binary could be
      # replaced from any branch that shares the cache.
      - name: Build gitleaks from source
        run: go install github.com/zricethezav/gitleaks/v8@v8.21.2
      - name: Scan the history for secrets
        run: |
          set -euo pipefail
          "$(go env GOPATH)/bin/gitleaks" detect --source . --redact --no-banner --verbose --exit-code 1

  prepare:
    needs: secret-scan
    name: Version, changelog, signing check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      version: ${{ steps.meta.outputs.version }}
      tag: ${{ steps.meta.outputs.tag }}
      prerelease: ${{ steps.meta.outputs.prerelease }}
      publish: ${{ steps.meta.outputs.publish }}
      updater_key: ${{ steps.keys.outputs.updater }}
      android_key: ${{ steps.keys.outputs.android }}
      missing_secrets: ${{ steps.keys.outputs.missing }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0 # tags and history for the changelog
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Version
        id: meta
        working-directory: web
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          VERSION="$(node scripts/version.mjs print)"
          node scripts/version.mjs check
          PUBLISH=false
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            PUBLISH=true
            if [[ "$GITHUB_REF_NAME" != "v$VERSION" ]]; then
              echo "::error::Tag $GITHUB_REF_NAME does not match the version in web/package.json ($VERSION). Run 'npm run version:set -- <version>' and commit before tagging."
              exit 1
            fi
          elif [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" && -n "$INPUT_VERSION" ]]; then
            if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
              echo "::error::Publishing by manual run is only allowed on main (this run: $GITHUB_REF)."
              exit 1
            fi
            if [[ "$INPUT_VERSION" != "$VERSION" ]]; then
              echo "::error::Input version '$INPUT_VERSION' does not match the version in web/package.json ($VERSION)."
              exit 1
            fi
            if git rev-parse -q --verify "refs/tags/v$VERSION" >/dev/null; then
              echo "::error::Tag v$VERSION already exists. Existing releases are never overwritten."
              exit 1
            fi
            PUBLISH=true
          fi
          {
            echo "version=$VERSION"
            echo "tag=v$VERSION"
            echo "prerelease=$([[ "$VERSION" == *-* ]] && echo true || echo false)"
            echo "publish=$PUBLISH"
          } >> "$GITHUB_OUTPUT"
          echo "Version $VERSION, versionCode $(node scripts/version.mjs code), publish=$PUBLISH"

      - name: Legal placeholders are filled (blocks publishing only)
        working-directory: web
        env:
          PUBLISH: ${{ steps.meta.outputs.publish }}
        run: |
          set -euo pipefail
          if [[ "$PUBLISH" == "true" ]]; then
            node scripts/check-legal.mjs --strict
          else
            node scripts/check-legal.mjs
          fi

      - name: Which signing keys are configured
        id: keys
        env:
          TAURI_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          ANDROID_KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KS_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_ALIAS_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          missing=()
          [ -n "$TAURI_KEY" ] || missing+=(TAURI_SIGNING_PRIVATE_KEY)
          [ -n "$TAURI_KEY_PASSWORD" ] || missing+=(TAURI_SIGNING_PRIVATE_KEY_PASSWORD)
          [ -n "$ANDROID_KS" ] || missing+=(ANDROID_KEYSTORE_BASE64)
          [ -n "$ANDROID_KS_PASSWORD" ] || missing+=(ANDROID_KEYSTORE_PASSWORD)
          [ -n "$ANDROID_ALIAS" ] || missing+=(ANDROID_KEY_ALIAS)
          [ -n "$ANDROID_ALIAS_PASSWORD" ] || missing+=(ANDROID_KEY_PASSWORD)
          echo "updater=$([ -n "$TAURI_KEY" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "android=$([ -n "$ANDROID_KS" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "missing=${missing[*]:-}" >> "$GITHUB_OUTPUT"

      - name: Published releases must be signed (all six secrets present)
        if: steps.meta.outputs.publish == 'true'
        run: |
          if [ -n "${{ steps.keys.outputs.missing }}" ]; then
            echo "::error::Missing GitHub secrets: ${{ steps.keys.outputs.missing }}. Nothing was built or published – see docs/howto/release-deps.md → Release."
            exit 1
          fi

      - name: Updater public key must not be the development placeholder
        if: steps.meta.outputs.publish == 'true'
        working-directory: web
        run: |
          KEY_ID="$(node -e "const c=require('./src-tauri/tauri.conf.json');console.log(Buffer.from(c.plugins.updater.pubkey,'base64').toString().split('\n')[0])")"
          echo "$KEY_ID"
          if [[ "$KEY_ID" == *76760D11981F2BAC* ]]; then
            echo "::error::plugins.updater.pubkey in web/src-tauri/tauri.conf.json is still the development placeholder. Put the public key from 'node scripts/keys.mjs updater' there (docs/howto/release-deps.md → Release) - otherwise installed apps could never verify an update."
            exit 1
          fi

      - name: Release notes from Conventional Commits
        working-directory: web
        run: node scripts/changelog.mjs --version "${{ steps.meta.outputs.version }}" --repo "https://github.com/${{ github.repository }}" --out "$RUNNER_TEMP/RELEASE_NOTES.md"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-notes
          path: ${{ runner.temp }}/RELEASE_NOTES.md

  windows:
    name: Windows (portable)
    needs: prepare
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: web
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable branch, toolchain: stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: web/src-tauri
      - run: npm ci
      # Built-in local model (llama.cpp, Vulkan + CPU in one exe). cmake and LLVM (bindgen) are on the
      # runner image; the Vulkan SDK (headers, loader import library, glslc) comes from Chocolatey, whose
      # package checks the installer's checksum. The weights are never part of the build (downloaded by
      # the user after consent, checksum-verified). See docs/decisions/local-model.md.
      - name: Vulkan SDK (for the local model's GPU backend)
        shell: pwsh
        run: |
          choco install vulkan-sdk -y --no-progress
          $sdk = (Get-ChildItem 'C:\VulkanSDK' -Directory | Sort-Object Name -Descending | Select-Object -First 1).FullName
          if (-not $sdk) { throw 'Vulkan SDK not found after install' }
          "VULKAN_SDK=$sdk" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "$sdk\Bin" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8

      # One self-contained executable with the frontend embedded – no NSIS/MSI installer.
      # llama.cpp builds its Vulkan shader generator (`vulkan-shaders-gen`) as a nested CMake project, and
      # two things break it on Windows: (1) the Visual Studio generator runs its ExternalProject steps out
      # of order in a parallel build ("Not a file ... cmake_install.cmake", "cannot find the batch label
      # specified - VCEnd"), so CMake builds with Ninja; (2) under the default target directory the nested
      # paths pass the Windows limit ("object file directory has 277 characters", "Cannot open source
      # file"), so Cargo builds into a short directory and the executable is put back where the following
      # steps expect it.
      - name: Build
        env:
          CMAKE_GENERATOR: Ninja
          CARGO_TARGET_DIR: C:/t
        run: npx tauri build --no-bundle -- --features local-llm-vulkan --locked

      - name: Put the executable where the next steps expect it
        run: |
          set -euo pipefail
          mkdir -p src-tauri/target/release
          cp C:/t/release/taschenmesser.exe src-tauri/target/release/taschenmesser.exe

      - name: Sign with the updater key
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          PUBLISH: ${{ needs.prepare.outputs.publish }}
          UPDATER_KEY: ${{ needs.prepare.outputs.updater_key }}
        run: |
          set -euo pipefail
          # Only a published release is signed: dry-run artifacts (every develop push touching the
          # shell) must not carry a valid release signature.
          if [ "$PUBLISH" = "true" ] && [ "$UPDATER_KEY" = "true" ]; then
            npx tauri signer sign src-tauri/target/release/taschenmesser.exe
          else
            echo "::warning::Dry run or no updater signing key: the portable executable is UNSIGNED."
          fi

      - name: Collect assets under their stable names
        run: |
          set -euo pipefail
          mkdir -p ../assets
          EXE=src-tauri/target/release/taschenmesser.exe
          cp "$EXE" ../assets/Nemo-Portable.exe
          [ -f "$EXE.sig" ] && cp "$EXE.sig" ../assets/Nemo-Portable.exe.sig
          ls -l ../assets

      # The program has to stay alive for a while (window created, WebView2 found). Informational only:
      # a hosted runner is not a real desktop.
      - name: Smoke test – the executable starts
        continue-on-error: true
        run: |
          set +e
          ../assets/Nemo-Portable.exe &
          PID=$!
          sleep 20
          if kill -0 "$PID" 2>/dev/null; then
            echo "The portable executable is still running after 20 s."
            kill "$PID"
          else
            echo "::warning::The portable executable exited within 20 s."
            exit 1
          fi

      - name: Audit – no secrets in the executable or what goes into it
        env:
          AUDIT_SECRET_ENV: TAURI_SIGNING_PRIVATE_KEY,TAURI_SIGNING_PRIVATE_KEY_PASSWORD,ANDROID_KEYSTORE_BASE64,ANDROID_KEYSTORE_PASSWORD,ANDROID_KEY_PASSWORD
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          EXE=src-tauri/target/release/taschenmesser.exe
          node scripts/audit-release.mjs --path dist --path ../assets --path "$EXE" --pubkey-from src-tauri/tauri.conf.json

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows
          path: assets/*
          if-no-files-found: error

  android:
    name: Android APK
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 17
          cache: gradle
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable branch, toolchain: stable
        with:
          toolchain: stable
          targets: aarch64-linux-android,armv7-linux-androideabi
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: web/src-tauri
      - run: npm ci

      - name: Android SDK and NDK
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platforms;android-34" "platforms;android-35" "platforms;android-36" "build-tools;35.0.0" "ndk;$NDK_VERSION"
          echo "NDK_HOME=$ANDROID_HOME/ndk/$NDK_VERSION" >> "$GITHUB_ENV"

      # The Gradle project is generated, not committed (src-tauri/gen is git-ignored).
      - run: npx tauri android init --ci
      # `tauri android init` writes the CLI's template icons; the project's launcher layers
      # (adaptive foreground/monochrome, notification icon, rendered by gen-icons) live in git.
      - name: Project icons into the generated Android project
        run: cp -r src-tauri/icons/android/. src-tauri/gen/android/app/src/main/res/

      - name: Build the (unsigned) universal APK
        run: npx tauri android build --apk --target aarch64 armv7 --config "$(node scripts/version.mjs android-config)"

      - name: Locate the APK
        id: apk
        run: |
          set -euo pipefail
          APK="$(find src-tauri/gen/android/app/build/outputs/apk -name '*.apk' | head -n1)"
          test -n "$APK"
          echo "path=$APK" >> "$GITHUB_OUTPUT"
          ls -l "$APK"

      - name: Sign
        if: needs.prepare.outputs.android_key == 'true'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          mkdir -p ../assets
          KEYSTORE="$RUNNER_TEMP/release.jks"
          # The keystore file exists only while signing – removed on success AND on failure.
          trap 'rm -f "$KEYSTORE"' EXIT
          umask 077
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$KEYSTORE"
          ANDROID_KEYSTORE_PATH="$KEYSTORE" \
            node scripts/android-sign.mjs "${{ steps.apk.outputs.path }}" ../assets/Nemo.apk
          (cd ../assets && sha256sum Nemo.apk > Nemo.apk.sha256 && cat Nemo.apk.sha256)

      - name: Unsigned APK (dry run without keystore)
        if: needs.prepare.outputs.android_key != 'true'
        run: |
          set -euo pipefail
          echo "::warning::No Android keystore configured: the APK is UNSIGNED and cannot be installed."
          mkdir -p ../assets
          cp "${{ steps.apk.outputs.path }}" ../assets/Nemo-unsigned.apk

      - name: Audit – no secrets in the APK or what goes into it
        env:
          AUDIT_SECRET_ENV: TAURI_SIGNING_PRIVATE_KEY,TAURI_SIGNING_PRIVATE_KEY_PASSWORD,ANDROID_KEYSTORE_BASE64,ANDROID_KEYSTORE_PASSWORD,ANDROID_KEY_PASSWORD
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          node scripts/audit-release.mjs --path dist --path ../assets

      - name: Make sure no keystore file is left on the runner
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: android
          path: assets/*
          if-no-files-found: error

  release:
    name: GitHub Release
    needs: [prepare, windows, android]
    if: needs.prepare.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dl
          merge-multiple: true

      - name: Final audit before anything is published
        env:
          AUDIT_SECRET_ENV: TAURI_SIGNING_PRIVATE_KEY,TAURI_SIGNING_PRIVATE_KEY_PASSWORD,ANDROID_KEYSTORE_BASE64,ANDROID_KEYSTORE_PASSWORD,ANDROID_KEY_PASSWORD
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: node web/scripts/audit-release.mjs --path dl --pubkey-from web/src-tauri/tauri.conf.json

      - name: Updater manifest (latest.json)
        run: |
          node web/scripts/latest-json.mjs --dir dl \
            --version "${{ needs.prepare.outputs.version }}" \
            --tag "${{ needs.prepare.outputs.tag }}" \
            --repo "$GITHUB_REPOSITORY" \
            --notes dl/RELEASE_NOTES.md --out dl/latest.json
          cat dl/latest.json
          node web/scripts/audit-release.mjs --path dl/latest.json

      # The checksum must match its file and latest.json must point at the Nemo executable.
      - name: Verify checksum and manifest
        run: |
          set -euo pipefail
          cd dl
          sha256sum -c Nemo.apk.sha256
          grep -q '/Nemo-Portable.exe"' latest.json

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # The list of assets lives in web/scripts/lib/releaseAssets.ts (also used by the link check).
          mapfile -t NAMES < <(node web/scripts/release-assets.mjs)
          FILES=()
          for f in "${NAMES[@]}"; do
            [ -f "dl/$f" ] && FILES+=("dl/$f")
          done
          if [ "${#FILES[@]}" -ne "${#NAMES[@]}" ]; then
            echo "::error::A release needs all ${#NAMES[@]} assets, found ${#FILES[@]}: ${FILES[*]}"
            exit 1
          fi
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            TAG_ARGS=(--verify-tag)
          else
            TAG_ARGS=(--target "$GITHUB_SHA") # manual run on main: gh creates the tag on exactly this commit
          fi
          ARGS=("${TAG_ARGS[@]}" --title "Nemo ${{ needs.prepare.outputs.version }}" --notes-file dl/RELEASE_NOTES.md)
          if [ "${{ needs.prepare.outputs.prerelease }}" = "true" ]; then ARGS+=(--prerelease); fi
          gh release create "${{ needs.prepare.outputs.tag }}" "${ARGS[@]}" "${FILES[@]}"

      # The README badges and the in-app updater rely on these URLs.
      - name: Check the download links of the published release
        run: |
          STABLE=""
          if [ "${{ needs.prepare.outputs.prerelease }}" != "true" ]; then STABLE="--stable"; fi
          node web/scripts/check-links.mjs --repo "$GITHUB_REPOSITORY" --tag "${{ needs.prepare.outputs.tag }}" $STABLE
      # The website (site/) shows version, size and checksums of the latest release; the Cloudflare
      # Pages deploy hook rebuilds it. No-op while the secret is empty (site/README.md, step 6).
      - name: Rebuild the website
        if: env.CF_PAGES_DEPLOY_HOOK != ''
        env:
          CF_PAGES_DEPLOY_HOOK: ${{ secrets.CF_PAGES_DEPLOY_HOOK }}
        run: curl -fsS -X POST "$CF_PAGES_DEPLOY_HOOK" > /dev/null

  summary:
    name: Dry-run summary
    needs: [prepare, windows, android]
    if: always() && needs.prepare.outputs.publish != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dl
          merge-multiple: true
      - name: List what was built
        run: |
          {
            echo "## Dry run – nothing was published"
            echo
            echo "Version \`${{ needs.prepare.outputs.version }}\`, updater key: **${{ needs.prepare.outputs.updater_key }}**, Android keystore: **${{ needs.prepare.outputs.android_key }}**, missing secrets: **${{ needs.prepare.outputs.missing_secrets || 'none' }}**"
            echo
            echo '```'
            ls -l dl
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
