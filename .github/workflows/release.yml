name: Release

# Tag `vX.Y.Z` (or `vX.Y.Z-beta.N`) → signed portable Windows exe + signed Android APK + GitHub Release.
# Second way: a manual run on `main` with the input `version` (must equal web/package.json, tag must not
# exist yet) builds the same and creates the tag + release itself. Use one way per release, never both.
# Pushes to `develop` or `main` that touch the native shell (the `main` run also warms the cache that a
# manual release run on `main` can read: caches written on develop are not visible there), and manual runs WITHOUT `version`, are DRY RUNS: they
# build and upload artifacts but never create a release. How to create keys/secrets and cut a release:
# see docs/howto/release-deps.md ("Release").

on:
  push:
    tags: ['v*.*.*']
    branches: [develop, main]
    paths:
      - 'web/src-tauri/**'
      - 'web/scripts/**'
      - '.github/workflows/release.yml'
  workflow_dispatch:
    inputs:
      version:
        description: 'Publish this version from main (must equal web/package.json; creates tag vX.Y.Z). Empty = dry run.'
        required: false
        default: ''
        type: string

permissions:
  contents: read

concurrency:
  # One group per ref: a release started right after a push to main waits for that push's dry run, which
  # leaves the Windows cache warm. (GitHub keeps one pending run per group; a newer push replaces a pending one.)
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  NODE_VERSION: 26
  NDK_VERSION: '27.2.12479018'

jobs:
  secret-scan:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the whole history is scanned, not just the last commit
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
      # Built from source through the Go module proxy (checksum-verified by go.sum / sumdb): no binary download to trust.
      # The compiled binary is cached per version so later runs skip the build (a miss rebuilds it).
      # Built fresh on every run (Go module proxy + checksum database); a cached binary could be
      # replaced from any branch that shares the cache.
      - name: Build gitleaks from source
        run: go install github.com/zricethezav/gitleaks/v8@v8.21.2
      - name: Scan the history for secrets
        run: |
          set -euo pipefail
          "$(go env GOPATH)/bin/gitleaks" detect --source . --redact --no-banner --verbose --exit-code 1

  prepare:
    needs: secret-scan
    name: Version, changelog, signing check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      version: ${{ steps.meta.outputs.version }}
      tag: ${{ steps.meta.outputs.tag }}
      prerelease: ${{ steps.meta.outputs.prerelease }}
      publish: ${{ steps.meta.outputs.publish }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # tags and history for the changelog
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Version
        id: meta
        working-directory: web
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          VERSION="$(node scripts/version.mjs print)"
          node scripts/version.mjs check
          PUBLISH=false
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            PUBLISH=true
            if [[ "$GITHUB_REF_NAME" != "v$VERSION" ]]; then
              echo "::error::Tag $GITHUB_REF_NAME does not match the version in web/package.json ($VERSION). Run 'npm run version:set -- <version>' and commit before tagging."
              exit 1
            fi
          elif [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" && -n "$INPUT_VERSION" ]]; then
            if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
              echo "::error::Publishing by manual run is only allowed on main (this run: $GITHUB_REF)."
              exit 1
            fi
            if [[ "$INPUT_VERSION" != "$VERSION" ]]; then
              echo "::error::Input version '$INPUT_VERSION' does not match the version in web/package.json ($VERSION)."
              exit 1
            fi
            if git rev-parse -q --verify "refs/tags/v$VERSION" >/dev/null; then
              echo "::error::Tag v$VERSION already exists. Existing releases are never overwritten."
              exit 1
            fi
            PUBLISH=true
          fi
          {
            echo "version=$VERSION"
            echo "tag=v$VERSION"
            echo "prerelease=$([[ "$VERSION" == *-* ]] && echo true || echo false)"
            echo "publish=$PUBLISH"
          } >> "$GITHUB_OUTPUT"
          echo "Version $VERSION, versionCode $(node scripts/version.mjs code), publish=$PUBLISH"

      - name: Legal placeholders are filled (blocks publishing only)
        working-directory: web
        env:
          PUBLISH: ${{ steps.meta.outputs.publish }}
        run: |
          set -euo pipefail
          if [[ "$PUBLISH" == "true" ]]; then
            node scripts/check-legal.mjs --strict
          else
            node scripts/check-legal.mjs
          fi

      # Dry runs never read the signing secrets (SC3): code merged to develop runs in them.
      - name: Which signing keys are configured
        if: steps.meta.outputs.publish == 'true'
        id: keys
        env:
          TAURI_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          ANDROID_KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KS_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_ALIAS_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          missing=()
          [ -n "$TAURI_KEY" ] || missing+=(TAURI_SIGNING_PRIVATE_KEY)
          [ -n "$TAURI_KEY_PASSWORD" ] || missing+=(TAURI_SIGNING_PRIVATE_KEY_PASSWORD)
          [ -n "$ANDROID_KS" ] || missing+=(ANDROID_KEYSTORE_BASE64)
          [ -n "$ANDROID_KS_PASSWORD" ] || missing+=(ANDROID_KEYSTORE_PASSWORD)
          [ -n "$ANDROID_ALIAS" ] || missing+=(ANDROID_KEY_ALIAS)
          [ -n "$ANDROID_ALIAS_PASSWORD" ] || missing+=(ANDROID_KEY_PASSWORD)
          echo "missing=${missing[*]:-}" >> "$GITHUB_OUTPUT"

      - name: Published releases must be signed (all six secrets present)
        if: steps.meta.outputs.publish == 'true'
        run: |
          if [ -n "${{ steps.keys.outputs.missing }}" ]; then
            echo "::error::Missing GitHub secrets: ${{ steps.keys.outputs.missing }}. Nothing was built or published – see docs/howto/release-deps.md → Release."
            exit 1
          fi

      - name: Updater public key must not be the development placeholder
        if: steps.meta.outputs.publish == 'true'
        working-directory: web
        run: |
          KEY_ID="$(node -e "const c=require('./src-tauri/tauri.conf.json');console.log(Buffer.from(c.plugins.updater.pubkey,'base64').toString().split('\n')[0])")"
          echo "$KEY_ID"
          if [[ "$KEY_ID" == *76760D11981F2BAC* ]]; then
            echo "::error::plugins.updater.pubkey in web/src-tauri/tauri.conf.json is still the development placeholder. Put the public key from 'node scripts/keys.mjs updater' there (docs/howto/release-deps.md → Release) - otherwise installed apps could never verify an update."
            exit 1
          fi

      # The sections were written into CHANGELOG.md / CHANGELOG.de.md by `npm run changelog:release` in the
      # release commit (docs/howto/changelog.md); the notes are the same text, German above, English below.
      - name: Release notes from the changelog section
        working-directory: web
        run: node scripts/changelog-notes.mjs "${{ steps.meta.outputs.version }}" --out "$RUNNER_TEMP/RELEASE_NOTES.md"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-notes
          path: ${{ runner.temp }}/RELEASE_NOTES.md

  windows:
    name: Windows (portable)
    needs: prepare
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      CARGO_TARGET_DIR: C:/t
    defaults:
      run:
        working-directory: web
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # A publishing build restores no cache (SC4): a cache written by a dry run of other code must not
      # reach a signed release. Dry runs keep their caches.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: ${{ needs.prepare.outputs.publish != 'true' && 'npm' || '' }}
          cache-dependency-path: web/package-lock.json
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable branch, toolchain: stable
        with:
          toolchain: stable
      # The runner image moves to a new MSVC toolset now and then; llama.cpp's CMake build cached under C:/t
      # keeps the old cl.exe path and fails ("is not a full path to an existing compiler tool"). The toolset
      # version is part of the cache key, so an image update starts a fresh cache instead.
      - name: MSVC toolset (part of the Rust cache key)
        id: msvc
        run: |
          set -euo pipefail
          shopt -s nullglob
          v=$(for d in "/c/Program Files/Microsoft Visual Studio"/*/*/VC/Tools/MSVC/*/; do basename "$d"; done | sort -V | tail -n 1)
          test -n "$v"
          echo "MSVC toolset: $v"
          echo "version=$v" >> "$GITHUB_OUTPUT"
      # The build below writes into C:/t (CARGO_TARGET_DIR, short path for llama.cpp). rust-cache does not
      # derive its target directory from that variable (it kept saving the empty src-tauri/target: 476 of
      # 476 crates were rebuilt on every run, 19 min), so C:/t is cached as an extra directory and the
      # unused default target is skipped. The registry and cargo bin are still cached as before.
      # A release (tag / manual run with version) neither restores nor writes it (SC4): a full rebuild.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        if: needs.prepare.outputs.publish != 'true'
        with:
          workspaces: web/src-tauri
          shared-key: windows-release-vk1.4.363.1-msvc${{ steps.msvc.outputs.version }}
          cache-targets: false
          cache-directories: C:/t
      - run: npm ci
      # Built-in local model (llama.cpp, Vulkan + CPU in one exe). cmake and LLVM (bindgen) are on the
      # runner image; the Vulkan SDK (headers, loader import library, glslc) comes from Chocolatey, whose
      # package checks the installer's checksum. The weights are never part of the build (downloaded by
      # the user after consent, checksum-verified). See docs/decisions/local-model.md.
      - name: Vulkan SDK (for the local model's GPU backend)
        shell: pwsh
        run: |
          choco install vulkan-sdk --version 1.4.363.1 -y --no-progress
          $sdk = (Get-ChildItem 'C:\VulkanSDK' -Directory | Sort-Object Name -Descending | Select-Object -First 1).FullName
          if (-not $sdk) { throw 'Vulkan SDK not found after install' }
          "VULKAN_SDK=$sdk" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "$sdk\Bin" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8

      # One self-contained executable with the frontend embedded – no NSIS/MSI installer.
      # llama.cpp builds its Vulkan shader generator (`vulkan-shaders-gen`) as a nested CMake project, and
      # two things break it on Windows: (1) the Visual Studio generator runs its ExternalProject steps out
      # of order in a parallel build ("Not a file ... cmake_install.cmake", "cannot find the batch label
      # specified - VCEnd"), so CMake builds with Ninja; (2) under the default target directory the nested
      # paths pass the Windows limit ("object file directory has 277 characters", "Cannot open source
      # file"), so Cargo builds into a short directory and the executable is put back where the following
      # steps expect it.
      - name: Build
        env:
          CMAKE_GENERATOR: Ninja
        run: npx tauri build --no-bundle -- --features local-llm-vulkan --locked

      - name: Put the executable where the next steps expect it
        run: |
          set -euo pipefail
          mkdir -p src-tauri/target/release
          cp C:/t/release/taschenmesser.exe src-tauri/target/release/taschenmesser.exe

      # Only a published release is signed, and only its steps see the key (SC3): dry-run artifacts
      # (every develop push touching the shell) never carry a valid release signature.
      - name: Sign with the updater key
        if: needs.prepare.outputs.publish == 'true'
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npx tauri signer sign src-tauri/target/release/taschenmesser.exe

      - name: Unsigned executable (dry run)
        if: needs.prepare.outputs.publish != 'true'
        run: echo "::warning::Dry run - the portable executable is UNSIGNED (dry runs never sign)."

      - name: Collect assets under their stable names
        run: |
          set -euo pipefail
          mkdir -p ../assets
          EXE=src-tauri/target/release/taschenmesser.exe
          cp "$EXE" ../assets/Nemo-Portable.exe
          [ -f "$EXE.sig" ] && cp "$EXE.sig" ../assets/Nemo-Portable.exe.sig
          ls -l ../assets

      # The program has to stay alive for a while (window created, WebView2 found). Informational only:
      # a hosted runner is not a real desktop.
      - name: Smoke test – the executable starts
        continue-on-error: true
        run: |
          set +e
          ../assets/Nemo-Portable.exe &
          PID=$!
          sleep 20
          if kill -0 "$PID" 2>/dev/null; then
            echo "The portable executable is still running after 20 s."
            kill "$PID"
          else
            echo "::warning::The portable executable exited within 20 s."
            exit 1
          fi

      - name: Audit – no secrets in the executable or what goes into it
        env:
          # The secret values reach the audit only when publishing (SC3); a dry run holds no key that
          # could have leaked into its artifacts, and the pattern rules still run. --publish makes a
          # missing value fail instead of silently searching for nothing.
          AUDIT_SECRET_ENV: TAURI_SIGNING_PRIVATE_KEY,TAURI_SIGNING_PRIVATE_KEY_PASSWORD,ANDROID_KEYSTORE_BASE64,ANDROID_KEYSTORE_PASSWORD,ANDROID_KEY_PASSWORD
          TAURI_SIGNING_PRIVATE_KEY: ${{ needs.prepare.outputs.publish == 'true' && secrets.TAURI_SIGNING_PRIVATE_KEY || '' }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ needs.prepare.outputs.publish == 'true' && secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD || '' }}
          ANDROID_KEYSTORE_BASE64: ${{ needs.prepare.outputs.publish == 'true' && secrets.ANDROID_KEYSTORE_BASE64 || '' }}
          ANDROID_KEYSTORE_PASSWORD: ${{ needs.prepare.outputs.publish == 'true' && secrets.ANDROID_KEYSTORE_PASSWORD || '' }}
          ANDROID_KEY_PASSWORD: ${{ needs.prepare.outputs.publish == 'true' && secrets.ANDROID_KEY_PASSWORD || '' }}
          PUBLISH_FLAG: ${{ needs.prepare.outputs.publish == 'true' && '--publish' || '' }}
        run: |
          set -euo pipefail
          EXE=src-tauri/target/release/taschenmesser.exe
          node scripts/audit-release.mjs --path dist --path ../assets --path "$EXE" --pubkey-from src-tauri/tauri.conf.json $PUBLISH_FLAG

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows
          path: assets/*
          if-no-files-found: error

  android:
    name: Android APK
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # No cache restore in a publishing build (SC4), as in the Windows job.
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: 17
          cache: ${{ needs.prepare.outputs.publish != 'true' && 'gradle' || '' }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: ${{ needs.prepare.outputs.publish != 'true' && 'npm' || '' }}
          cache-dependency-path: web/package-lock.json
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable branch, toolchain: stable
        with:
          toolchain: stable
          targets: aarch64-linux-android,armv7-linux-androideabi
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        if: needs.prepare.outputs.publish != 'true'
        with:
          workspaces: web/src-tauri
      - run: npm ci

      - name: Android SDK and NDK
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platforms;android-34" "platforms;android-35" "platforms;android-36" "build-tools;35.0.0" "ndk;$NDK_VERSION"
          echo "NDK_HOME=$ANDROID_HOME/ndk/$NDK_VERSION" >> "$GITHUB_ENV"

      # The Gradle project is generated, not committed (src-tauri/gen is git-ignored).
      - run: npx tauri android init --ci
      # The template leaves `android:allowBackup` unset (= true: the app data would go to Google backup).
      - name: Android manifest hardening (allowBackup off)
        run: node scripts/android-manifest.mjs
      # Launcher shortcuts (share-intent plugin, res/xml/shortcuts.xml) name their target app
      # literally: resource XML knows no ${applicationId}. Point them at this build's id.
      - name: Application id into the launcher shortcuts
        run: node scripts/android-shortcuts.mjs src-tauri/tauri.conf.json
      # `tauri android init` writes the CLI's template icons; the project's launcher layers
      # (adaptive foreground/monochrome, notification icon, rendered by gen-icons) live in git.
      - name: Project icons into the generated Android project
        run: cp -r src-tauri/icons/android/. src-tauri/gen/android/app/src/main/res/

      - name: Build the (unsigned) universal APK
        run: npx tauri android build --apk --target aarch64 armv7 --config "$(node scripts/version.mjs android-config)"

      - name: Locate the APK
        id: apk
        run: |
          set -euo pipefail
          APK="$(find src-tauri/gen/android/app/build/outputs/apk -name '*.apk' | head -n1)"
          test -n "$APK"
          echo "path=$APK" >> "$GITHUB_OUTPUT"
          ls -l "$APK"

      # Only a published release is signed (SC3); prepare already failed it when a key is missing.
      - name: Sign
        if: needs.prepare.outputs.publish == 'true'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          mkdir -p ../assets
          KEYSTORE="$RUNNER_TEMP/release.jks"
          # The keystore file exists only while signing – removed on success AND on failure.
          trap 'rm -f "$KEYSTORE"' EXIT
          umask 077
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$KEYSTORE"
          ANDROID_KEYSTORE_PATH="$KEYSTORE" \
            node scripts/android-sign.mjs "${{ steps.apk.outputs.path }}" ../assets/Nemo.apk
          (cd ../assets && sha256sum Nemo.apk > Nemo.apk.sha256 && cat Nemo.apk.sha256)

      - name: Unsigned APK (dry run)
        if: needs.prepare.outputs.publish != 'true'
        run: |
          set -euo pipefail
          echo "::warning::Dry run - the APK is UNSIGNED and cannot be installed (dry runs never sign)."
          mkdir -p ../assets
          cp "${{ steps.apk.outputs.path }}" ../assets/Nemo-unsigned.apk

      # What Android really installs (NS4): the merged manifest of the APK that goes out, against the
      # allow-list in scripts/lib/apkManifest.ts (permissions, exported components, no cleartext, no backup).
      - name: Merged manifest of the APK (allow-list)
        run: |
          set -euo pipefail
          APK="$(ls ../assets/*.apk)"
          "$ANDROID_HOME/cmdline-tools/latest/bin/apkanalyzer" manifest print "$APK" > "$RUNNER_TEMP/merged-manifest.xml"
          node scripts/apk-manifest-check.mjs "$RUNNER_TEMP/merged-manifest.xml"

      - name: Audit – no secrets in the APK or what goes into it
        env:
          # The secret values reach the audit only when publishing (SC3); a dry run holds no key that
          # could have leaked into its artifacts, and the pattern rules still run. --publish makes a
          # missing value fail instead of silently searching for nothing.
          AUDIT_SECRET_ENV: TAURI_SIGNING_PRIVATE_KEY,TAURI_SIGNING_PRIVATE_KEY_PASSWORD,ANDROID_KEYSTORE_BASE64,ANDROID_KEYSTORE_PASSWORD,ANDROID_KEY_PASSWORD
          TAURI_SIGNING_PRIVATE_KEY: ${{ needs.prepare.outputs.publish == 'true' && secrets.TAURI_SIGNING_PRIVATE_KEY || '' }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ needs.prepare.outputs.publish == 'true' && secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD || '' }}
          ANDROID_KEYSTORE_BASE64: ${{ needs.prepare.outputs.publish == 'true' && secrets.ANDROID_KEYSTORE_BASE64 || '' }}
          ANDROID_KEYSTORE_PASSWORD: ${{ needs.prepare.outputs.publish == 'true' && secrets.ANDROID_KEYSTORE_PASSWORD || '' }}
          ANDROID_KEY_PASSWORD: ${{ needs.prepare.outputs.publish == 'true' && secrets.ANDROID_KEY_PASSWORD || '' }}
          PUBLISH_FLAG: ${{ needs.prepare.outputs.publish == 'true' && '--publish' || '' }}
        run: |
          set -euo pipefail
          node scripts/audit-release.mjs --path dist --path ../assets $PUBLISH_FLAG

      - name: Make sure no keystore file is left on the runner
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android
          path: assets/*
          if-no-files-found: error

  release:
    name: GitHub Release
    needs: [prepare, windows, android]
    if: needs.prepare.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dl
          merge-multiple: true

      - name: Final audit before anything is published
        env:
          AUDIT_SECRET_ENV: TAURI_SIGNING_PRIVATE_KEY,TAURI_SIGNING_PRIVATE_KEY_PASSWORD,ANDROID_KEYSTORE_BASE64,ANDROID_KEYSTORE_PASSWORD,ANDROID_KEY_PASSWORD
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: node web/scripts/audit-release.mjs --path dl --pubkey-from web/src-tauri/tauri.conf.json --publish

      - name: Updater manifest (latest.json)
        run: |
          node web/scripts/latest-json.mjs --dir dl \
            --version "${{ needs.prepare.outputs.version }}" \
            --tag "${{ needs.prepare.outputs.tag }}" \
            --repo "$GITHUB_REPOSITORY" \
            --notes dl/RELEASE_NOTES.md --out dl/latest.json
          cat dl/latest.json
          node web/scripts/audit-release.mjs --path dl/latest.json

      # The checksum must match its file and latest.json must point at the Nemo executable.
      - name: Verify checksum and manifest
        run: |
          set -euo pipefail
          cd dl
          sha256sum -c Nemo.apk.sha256
          grep -q '/Nemo-Portable.exe"' latest.json

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # The list of assets lives in web/scripts/lib/releaseAssets.ts (also used by the link check).
          mapfile -t NAMES < <(node web/scripts/release-assets.mjs)
          FILES=()
          for f in "${NAMES[@]}"; do
            [ -f "dl/$f" ] && FILES+=("dl/$f")
          done
          if [ "${#FILES[@]}" -ne "${#NAMES[@]}" ]; then
            echo "::error::A release needs all ${#NAMES[@]} assets, found ${#FILES[@]}: ${FILES[*]}"
            exit 1
          fi
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            TAG_ARGS=(--verify-tag)
          else
            TAG_ARGS=(--target "$GITHUB_SHA") # manual run on main: gh creates the tag on exactly this commit
          fi
          ARGS=("${TAG_ARGS[@]}" --title "Nemo ${{ needs.prepare.outputs.version }}" --notes-file dl/RELEASE_NOTES.md)
          if [ "${{ needs.prepare.outputs.prerelease }}" = "true" ]; then ARGS+=(--prerelease); fi
          gh release create "${{ needs.prepare.outputs.tag }}" "${ARGS[@]}" "${FILES[@]}"

      # The README badges and the in-app updater rely on these URLs.
      - name: Check the download links of the published release
        run: |
          STABLE=""
          if [ "${{ needs.prepare.outputs.prerelease }}" != "true" ]; then STABLE="--stable"; fi
          node web/scripts/check-links.mjs --repo "$GITHUB_REPOSITORY" --tag "${{ needs.prepare.outputs.tag }}" $STABLE
      # The website (site/) shows version, size and checksums of the latest release; the Cloudflare
      # Pages deploy hook rebuilds it. No-op while the secret is empty (site/README.md, step 6).
      - name: Rebuild the website
        env:
          CF_PAGES_DEPLOY_HOOK: ${{ secrets.CF_PAGES_DEPLOY_HOOK }}
        # The check lives in the script: a step's own `env` is not visible to its `if:`.
        run: |
          if [ -z "$CF_PAGES_DEPLOY_HOOK" ]; then echo "No deploy hook configured, skipping."; exit 0; fi
          curl -fsS -X POST "$CF_PAGES_DEPLOY_HOOK" > /dev/null

  summary:
    name: Dry-run summary
    needs: [prepare, windows, android]
    if: always() && needs.prepare.outputs.publish != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dl
          merge-multiple: true
      - name: List what was built
        run: |
          {
            echo "## Dry run – nothing was published"
            echo
            echo "Version \`${{ needs.prepare.outputs.version }}\`. Dry runs neither read nor use the signing keys: the artifacts are unsigned."
            echo
            echo '```'
            ls -l dl
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
