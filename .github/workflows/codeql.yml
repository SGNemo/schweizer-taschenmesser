# For most projects, this workflow file will not need changing; you simply need
# to commit it to your repository.
#
# You may wish to alter this file to override the set of languages analyzed,
# or to provide custom queries or build logic.
#
# ******** NOTE ********
# We have attempted to detect the languages in your repository. Please check
# the `language` matrix defined below to confirm you have the correct set of
# supported CodeQL languages.
#
name: "CodeQL Advanced"

on:
  push:
    branches: [ "develop" ]
  pull_request:
    branches: [ "develop" ]
  schedule:
    - cron: '39 2 * * 3'
  workflow_dispatch:

# A newer push to the same pull request replaces the older scan. Every other event (push to develop, weekly,
# manual) gets its own group per run, so nothing is cancelled and no pending run is replaced: every push to
# develop gets its scope decision (job `scope`).
concurrency:
  group: codeql-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Rust takes 9 to 14 min, the other languages 1 to 2. This job decides which languages the run analyses and
  # hands them to `analyze` as its matrix, so a language that is not analysed takes no runner:
  # - only text changed (.md/.txt/LICENSE under the `ignorable` paths of ci.yml): nothing. `analyze` is then
  #   skipped and shows as one skipped check with the unexpanded name "Analyze (${{ matrix.language }})";
  # - anything else changed: Actions + JS/TS, and Rust when the change touches Rust (or this file);
  # - the first green run of a UTC day on a branch (the nightly dispatch on develop, or else the first push, even
  #   a docs-only one), the weekly run, a manual run, and every change that cannot be read: all three.
  # So no state of develop stays unscanned for longer than a day once nightly.yml is on main (scheduled workflows
  # start from the default branch); until then: until the first push of the next day. Fail-open: if this job
  # fails or gives no list, `analyze` falls back to all three. Decision: docs/decisions/meta-ci-docs.md (2026-11-11).
  scope:
    name: CodeQL scope
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      languages: ${{ steps.diff.outputs.languages }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - id: diff
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          BRANCH: ${{ github.ref_name }}
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.sha }}
        run: |
          set +e
          all='["actions","javascript-typescript","rust"]'
          languages="$all"
          range=""
          why="$EVENT run: always everything"
          if [ "$EVENT" = "pull_request" ]; then
            why="the changed files could not be read"
            if [ -n "$PR_BASE" ] && [ -n "$PR_HEAD" ]; then range="$PR_BASE...$PR_HEAD"; fi
          elif [ "$EVENT" = "push" ]; then
            why="the pushed range could not be read"
            if [ -n "$PUSH_BEFORE" ] && [ "${PUSH_BEFORE//0/}" != "" ]; then range="$PUSH_BEFORE..$PUSH_AFTER"; fi
            # Daily full scan: until a run of this UTC day on this branch has ended green, every push analyses
            # everything (a running, red or cancelled run does not count, so the first green run of a day is
            # always a full one). Whatever started it counts: once the nightly run dispatches this workflow on
            # develop, that run is the first of the day.
            today="$(date -u +%Y-%m-%d)"
            earlier="$(gh api -X GET "repos/$REPO/actions/workflows/codeql.yml/runs" -f "branch=$BRANCH" -f "created=>=$today" -f per_page=100 \
              --jq "[.workflow_runs[] | select(.id < $RUN_ID and .event != \"pull_request\" and .conclusion == \"success\")] | length" 2>/dev/null)"
            case "$earlier" in
              ''|*[!0-9]*) range=""; why="earlier runs of today could not be read" ;;
              0) range=""; why="no green run on $BRANCH yet on $today (UTC): daily full scan" ;;
            esac
          fi
          if [ -n "$range" ] && files="$(git -c core.quotePath=false diff --no-renames --name-only "$range" 2>/dev/null)" && [ -n "$files" ]; then
            # Paths as `ignorable` in ci.yml, but only their text files: docs/ and site/ also hold JS and HTML
            # that the JS/TS analysis reads. --no-renames: a file moved out of analysed code shows its old path.
            # A path git still quotes (quote, backslash, control character in the name) counts as Rust.
            ignorable='^(docs/|site/|scribble/|CLAUDE\.md$|CONTRIBUTING\.md$|SECURITY\.md$|CHANGELOG(\.de)?\.md$|LICENSE$|\.github/ISSUE_TEMPLATE/|\.github/PULL_REQUEST_TEMPLATE\.md$)'
            text='(\.(md|txt)$|^LICENSE$)'
            if ! printf '%s\n' "$files" | grep -Evq "$ignorable" && ! printf '%s\n' "$files" | grep -Evq "$text"; then
              languages='[]'; why="only documentation text changed ($range)"
            elif printf '%s\n' "$files" | grep -Eq '(^"|\.rs$|(^|/)Cargo\.(toml|lock)$|(^|/)rust-toolchain(\.toml)?$|(^|/)\.cargo/|^web/src-tauri/|^\.github/workflows/codeql\.yml$)'; then
              why="the change touches Rust ($range)"
            else
              languages='["actions","javascript-typescript"]'; why="no Rust file changed ($range)"
            fi
          fi
          echo "languages=$languages" >> "$GITHUB_OUTPUT"
          case "$languages" in
            "$all") said="Actions, JS/TS, Rust"; rest="" ;;
            '[]') said="nothing"; rest=" Actions, JS/TS and Rust: next daily full scan of develop." ;;
            *) said="Actions, JS/TS"; rest=" Rust: next daily full scan of develop." ;;
          esac
          echo "::notice title=CodeQL scope::Analysed in this run: $said. Why: $why.$rest"
          echo "### CodeQL scope: $said" >> "$GITHUB_STEP_SUMMARY"
          echo "Why: $why.$rest" >> "$GITHUB_STEP_SUMMARY"

  analyze:
    name: Analyze (${{ matrix.language }})
    needs: scope
    # An empty list (documentation only) must not reach the matrix: a matrix without entries fails the workflow.
    # Only a green `scope` may switch the analysis off; a failed one leaves the list empty and all three run.
    if: ${{ !cancelled() && (needs.scope.result != 'success' || needs.scope.outputs.languages != '[]') }}
    # Runner size impacts CodeQL analysis time. To learn more, please see:
    #   - https://gh.io/recommended-hardware-resources-for-running-codeql
    #   - https://gh.io/supported-runners-and-hardware-resources
    #   - https://gh.io/using-larger-runners (GitHub.com only)
    # Consider using larger runners or machines with greater resources for possible analysis time improvements.
    runs-on: ${{ (matrix.language == 'swift' && 'macos-latest') || 'ubuntu-latest' }}
    # Rust takes 13 min (p90 15.4, Nov 2026); without a limit a hang holds a runner for six hours.
    timeout-minutes: 40
    permissions:
      # required for all workflows
      security-events: write

      # required to fetch internal or private CodeQL packs
      packages: read

      # only required for workflows in private repositories
      actions: read
      contents: read

    strategy:
      fail-fast: false
      matrix:
        # java-kotlin is not analysed: the Gradle project is generated only in CI (tauri android init), so autobuild fails, and build-mode none reads .java only (the plugins are Kotlin)
        language: ${{ fromJSON(needs.scope.result == 'success' && needs.scope.outputs.languages || '["actions","javascript-typescript","rust"]') }}
        build-mode: [none]
        # CodeQL supports the following values keywords for 'language': 'actions', 'c-cpp', 'csharp', 'go', 'java-kotlin', 'javascript-typescript', 'python', 'ruby', 'rust', 'swift'
        # Use `c-cpp` to analyze code written in C, C++ or both
        # Use 'java-kotlin' to analyze code written in Java, Kotlin or both
        # Use 'javascript-typescript' to analyze code written in JavaScript, TypeScript or both
        # To learn more about changing the languages that are analyzed or customizing the build mode for your analysis,
        # see https://docs.github.com/en/code-security/code-scanning/creating-an-advanced-setup-for-code-scanning/customizing-your-advanced-setup-for-code-scanning.
        # If you are analyzing a compiled language, you can modify the 'build-mode' for that language to customize how
        # your codebase is analyzed, see https://docs.github.com/en/code-security/code-scanning/creating-an-advanced-setup-for-code-scanning/codeql-code-scanning-for-compiled-languages
    steps:
    - name: Checkout repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

    # Add any setup steps before running the `github/codeql-action/init` action.
    # This includes steps like installing compilers or runtimes (`actions/setup-node`
    # or others). This is typically only required for manual builds.
    # - name: Setup runtime (example)
    #   uses: actions/setup-example@v1

    # Initializes the CodeQL tools for scanning.
    - name: Initialize CodeQL
      uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4
      with:
        languages: ${{ matrix.language }}
        build-mode: ${{ matrix.build-mode }}
        # If you wish to specify custom queries, you can do so here or in a config file.
        # By default, queries listed here will override any specified in a config file.
        # Prefix the list here with "+" to use these queries and those in the config file.

        # For more details on CodeQL's query packs, refer to: https://docs.github.com/en/code-security/code-scanning/automatically-scanning-your-code-for-vulnerabilities-and-errors/configuring-code-scanning#using-queries-in-ql-packs
        # queries: security-extended,security-and-quality

    # If the analyze step fails for one of the languages you are analyzing with
    # "We were unable to automatically build your code", modify the matrix above
    # to set the build mode to "manual" for that language. Then modify this step
    # to build your code.
    # ℹ️ Command-line programs to run using the OS shell.
    # 📚 See https://docs.github.com/en/actions/using-workflows/workflow-syntax-for-github-actions#jobsjob_idstepsrun
    - name: Run manual build steps
      if: matrix.build-mode == 'manual'
      shell: bash
      run: |
        echo 'If you are using a "manual" build mode for one or more of the' \
          'languages you are analyzing, replace this with the commands to build' \
          'your code, for example:'
        echo '  make bootstrap'
        echo '  make release'
        exit 1

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4
      with:
        category: "/language:${{matrix.language}}"
