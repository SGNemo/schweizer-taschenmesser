# Dependabot version updates. Only effective on the default branch (main); PRs target develop.
# Policy: patch + minor updates are grouped per ecosystem, majors arrive as separate PRs for review.
version: 2
updates:
  - package-ecosystem: npm
    directory: "/web"
    target-branch: develop
    schedule:
      interval: weekly
      day: monday
      time: "05:00"
      timezone: Europe/Berlin
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - javascript
    commit-message:
      prefix: "chore(deps)"
    groups:
      npm-dev-dependencies:
        dependency-type: development
        update-types: [minor, patch]
      npm-minor-patch:
        dependency-type: production
        update-types: [minor, patch]
    ignore:
      # pdf-lib is pinned to 1.17.1 on purpose (docs/DECISIONS.md).
      - dependency-name: typescript
        update-types: [version-update:semver-minor, version-update:semver-major]
      - dependency-name: pdf-lib
  - package-ecosystem: npm
    directory: "/server"
    target-branch: develop
    schedule:
      interval: weekly
      day: monday
      time: "05:00"
      timezone: Europe/Berlin
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - javascript
    commit-message:
      prefix: "chore(deps)"
    groups:
      npm-dev-dependencies:
        dependency-type: development
        update-types: [minor, patch]
      npm-minor-patch:
        dependency-type: production
        update-types: [minor, patch]
    ignore:
      # TypeScript is pinned to 6.0.x: typescript-eslint supports < 6.1 only.
      - dependency-name: typescript
        update-types: [version-update:semver-minor, version-update:semver-major]
  - package-ecosystem: npm
    directory: "/mcp"
    target-branch: develop
    schedule:
      interval: weekly
      day: monday
      time: "05:00"
      timezone: Europe/Berlin
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - javascript
    commit-message:
      prefix: "chore(deps)"
    groups:
      npm-dev-dependencies:
        dependency-type: development
        update-types: [minor, patch]
      npm-minor-patch:
        dependency-type: production
        update-types: [minor, patch]
    ignore:
      # TypeScript is pinned to 6.0.x: typescript-eslint supports < 6.1 only.
      - dependency-name: typescript
        update-types: [version-update:semver-minor, version-update:semver-major]
  - package-ecosystem: npm
    directory: "/design/icon"
    target-branch: develop
    schedule:
      interval: weekly
      day: monday
      time: "05:00"
      timezone: Europe/Berlin
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - javascript
    commit-message:
      prefix: "chore(deps)"
    groups:
      npm-dev-dependencies:
        dependency-type: development
        update-types: [minor, patch]
      npm-minor-patch:
        dependency-type: production
        update-types: [minor, patch]
  - package-ecosystem: cargo
    directory: "/web/src-tauri"
    target-branch: develop
    schedule:
      interval: weekly
      day: monday
      time: "05:00"
      timezone: Europe/Berlin
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - cargo
    commit-message:
      prefix: "chore(deps)"
    groups:
      tauri:
        patterns: ["tauri*", "wry", "tao"]
        update-types: [minor, patch]
      cargo-minor-patch:
        update-types: [minor, patch]
    ignore:
      # Tauri crates move together; a major is a deliberate migration.
      - dependency-name: "tauri*"
        update-types: [version-update:semver-major]
  - package-ecosystem: gradle
    directory: "/web/src-tauri/plugins/apk-installer/android"
    target-branch: develop
    schedule:
      interval: weekly
      day: monday
      time: "05:00"
      timezone: Europe/Berlin
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - gradle
    commit-message:
      prefix: "chore(deps)"
    groups:
      gradle-minor-patch:
        update-types: [minor, patch]
  - package-ecosystem: gradle
    directory: "/web/src-tauri/plugins/secure-store/android"
    target-branch: develop
    schedule:
      interval: weekly
      day: monday
      time: "05:00"
      timezone: Europe/Berlin
