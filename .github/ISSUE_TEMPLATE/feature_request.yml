name: Feature request
description: Suggest a module, a tool or an improvement
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: Have a quick look at [docs/ROADMAP.md](../blob/develop/docs/ROADMAP.md); the idea may already be there. German is fine too (Deutsch geht auch).
  - type: textarea
    id: problem
    attributes:
      label: Which problem does it solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options: [Module, Tool, Core (sync, backup, search), Design, Security, Platform (Windows, Android, PWA), Other]
