name: Translation
description: A wrong, odd or missing translation in the app or the docs
labels: [translation]
body:
  - type: markdown
    attributes:
      value: Thanks for helping with the wording! Translations are partly machine-made, so corrections from native speakers are very welcome. Please no real data in screenshots.
  - type: dropdown
    id: language
    attributes:
      label: Language
      options: [Deutsch, English, Español, Français, Português (Brasil)]
    validations:
      required: true
  - type: input
    id: where
    attributes:
      label: Where did you see it?
      description: Screen or doc file, for example "Settings → General" or docs/user/sync.md
    validations:
      required: true
  - type: textarea
    id: current
    attributes:
      label: Current text
    validations:
      required: true
  - type: textarea
    id: suggestion
    attributes:
      label: Suggested text and why
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: App version (optional)
      description: Settings → App updates
