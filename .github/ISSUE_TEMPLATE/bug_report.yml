name: Bug report
description: Something does not work as expected
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Thanks! Please do not put real data (names, amounts, tokens) in screenshots or logs. Report security problems via SECURITY.md, not here. German is fine too (Deutsch geht auch).
  - type: input
    id: version
    attributes:
      label: Version
      description: Settings → App updates
      placeholder: 0.3.1
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - Windows (Nemo-Portable.exe)
        - Android (Nemo.apk)
        - PWA in the browser
        - Sync server
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. …
        2. …
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected and what happened
    validations:
      required: true
  - type: textarea
    id: extra
    attributes:
      label: Screenshot or error message (optional)
